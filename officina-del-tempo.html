<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Il Caso del Falegname</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Spectral', Georgia, serif;
    color: #211b12;
    background:
      radial-gradient(circle at 14% 8%, rgba(245,129,13,.15), transparent 40%),
      radial-gradient(circle at 88% 24%, rgba(19,176,161,.13), transparent 42%),
      radial-gradient(circle at 82% 90%, rgba(230,53,37,.11), transparent 46%),
      linear-gradient(rgba(180,150,95,.06) 1px, transparent 1px),
      radial-gradient(#d7c49a .6px, transparent .6px),
      #f2e8d3;
    background-size: 100% 100%, 100% 100%, 100% 100%, 100% 30px, 16px 16px, 100% 100%;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  @keyframes flt { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-10px) rotate(3deg)} }
  @keyframes blk { 0%,93%,100%{transform:scaleY(1)} 96.5%{transform:scaleY(.08)} }
  @keyframes lk { 0%,100%{transform:translate(0,0)} 30%{transform:translate(3px,-2px)} 65%{transform:translate(-3px,2px)} }
  @keyframes drawline { to { stroke-dashoffset: 0; } }
  @keyframes toastIn { from { transform: translate(-50%, 130%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes festaPop { 0% { transform: scale(.7); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes coriandolo { 0% { transform: translateY(-30px) rotate(0); opacity: 1; } 100% { transform: translateY(420px) rotate(340deg); opacity: 0; } }
  @keyframes drw { to { stroke-dashoffset:0 } }
  .lens { animation: flt 5s ease-in-out infinite }
  .eyelid { transform-box:fill-box; transform-origin:center; animation: blk 5s infinite }
  .pupil { transform-box:fill-box; transform-origin:center; animation: lk 6s ease-in-out infinite }
  .uline { stroke-dasharray:300; stroke-dashoffset:300; animation: drw 1s ease .5s forwards }
  @media (prefers-reduced-motion: reduce){ .lens,.eyelid,.pupil{animation:none} .uline{stroke-dashoffset:0;animation:none} }
  @media (max-width: 600px) {
    .grid-2 { grid-template-columns: 1fr !important; }
  }
</style>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ============================================================================
// PALETTE & FONT
// ============================================================================

const C = {
  bg: '#f2e8d3',
  paper: '#fdf9f0',
  paperDeep: '#ecd9b2',
  ink: '#211b12',
  inkSoft: '#7a6a48',
  line: '#cdb489',
  wax: '#e63525',
  storia: '#43a456',   // verde — fatto documentato
  vangelo: '#e8920f',  // arancio/ocra — lo raccontano i vangeli
  fede: '#2f6fd6',     // blu — quello che si crede
};

const F_DISPLAY = "'Fraunces', Georgia, serif";
const F_BODY = "'Spectral', Georgia, serif";
const F_HAND = "'Caveat', 'Comic Sans MS', cursive";
const F_MONO = "'Courier Prime', 'Courier New', monospace";

// ============================================================================
// ICONE
// ============================================================================

const ICONS = {
  'arrow-left': <><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></>,
  'arrow-right': <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
  'search': <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
  'check': <path d="M20 6 9 17l-5-5"/>,
  'map-pin': <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,
  'scroll': <><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></>,
  'stamp': <><path d="M5 22h14"/><path d="M19.27 13.73A2.5 2.5 0 0 0 17.5 13h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1.5c0-.66-.26-1.3-.73-1.77Z"/><path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-3-3 3 3 0 0 0-3 3c0 2 1 2 1 3.5V13"/></>,
  'eye': <><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></>,
  'globe': <><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></>,
  'users': <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
  'gavel': <><path d="m14.5 12.5-8 8a2.119 2.119 0 1 1-3-3l8-8"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></>,
  'help': <><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></>,
};

function Icon({ name, size = 24, strokeWidth = 2, color, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color || 'currentColor'} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" style={style}>
      {ICONS[name]}
    </svg>
  );
}

// ============================================================================
// STORAGE
// ============================================================================

const STORE_KEY = 'officina-del-tempo-v2';
const OLD_KEY = 'officina-del-tempo-v1';
const CASO_CORRENTE = 'falegname'; // il caso attivo; in futuro diventerà selezionabile

const PROFILE_COLORS = ['#e8920f', '#43a456', '#e63525', '#2f6fd6', '#9b59b6', '#13b0a1'];
const PROFILE_AVATARS = ['🦊', '🐱', '🐯', '🦉', '🐢', '🦄', '🐙', '🦁', '🐧', '🦋'];

function makeId() { return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function freshProgress() {
  return { casi: { [CASO_CORRENTE]: { letti: [], chiuso: false } } };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return { profiles: p.profiles || [], activeId: p.activeId || null, progressByProfile: p.progressByProfile || {} };
    }
    // migrazione dal vecchio schema a detective singolo
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      if (o && o.detective && o.detective.nome) {
        const id = makeId();
        const prog = { casi: o.casi || { [CASO_CORRENTE]: { letti: [], chiuso: false } } };
        return {
          profiles: [{ id, name: o.detective.nome, avatar: PROFILE_AVATARS[0], color: PROFILE_COLORS[0] }],
          activeId: null,
          progressByProfile: { [id]: prog },
        };
      }
    }
  } catch (e) {}
  return { profiles: [], activeId: null, progressByProfile: {} };
}

function saveStore(store) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}

function profileStats(prog) {
  if (!prog || !prog.casi) return { reperti: 0, casiChiusi: 0 };
  let reperti = 0, casiChiusi = 0;
  Object.values(prog.casi).forEach(c => { reperti += (c.letti || []).length; if (c.chiuso) casiChiusi++; });
  return { reperti, casiChiusi };
}

// ============================================================================
// COMPONENTI DI BASE
// ============================================================================

// Etichetta colorata dei tre livelli
function Tag({ kind, small }) {
  const map = {
    storia: { c: C.storia, t: 'STORIA' },
    vangelo: { c: C.vangelo, t: 'VANGELO' },
    fede: { c: C.fede, t: 'FEDE' },
  };
  const m = map[kind];
  return (
    <span style={{
      background: m.c, color: '#fff', fontFamily: F_MONO, fontWeight: 700,
      fontSize: small ? 9 : 11, letterSpacing: 1, padding: small ? '2px 6px' : '3px 8px',
      borderRadius: 2, display: 'inline-block', verticalAlign: 'middle',
    }}>{m.t}</span>
  );
}

function Stamp({ children, color = C.wax }) {
  return (
    <div style={{
      display: 'inline-block', border: `2.5px solid ${color}`, color: color,
      fontFamily: F_MONO, fontWeight: 700, fontSize: 11, letterSpacing: 2,
      padding: '4px 12px', borderRadius: 3, transform: 'rotate(-2deg)',
      opacity: 0.9,
    }}>{children}</div>
  );
}

function SectionTitle({ kicker, title, color = C.wax }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontFamily: F_MONO, fontSize: 11, color: color, letterSpacing: 2, fontWeight: 700, marginBottom: 6 }}>
        {kicker}
      </div>
      <h2 style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 'clamp(30px, 5vw, 42px)', margin: 0, lineHeight: 1.05, color: C.ink }}>
        {title}
      </h2>
    </div>
  );
}

function Hook({ children, accent = C.wax }) {
  // Blocco "lo sapevi che" — il gancio di curiosità
  return (
    <div style={{
      background: C.paper, borderLeft: `4px solid ${accent}`,
      padding: '14px 18px', borderRadius: '0 4px 4px 0', margin: '16px 0',
      fontSize: 17, lineHeight: 1.55,
    }}>{children}</div>
  );
}

// Consegna evidente: "cosa devi fare", impossibile non vederla
function Task({ children, color = C.wax }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 11, background: color, color: '#fff',
      borderRadius: 7, padding: '12px 16px', margin: '18px 0 14px',
      boxShadow: `3px 3px 0 ${C.ink}`,
    }}>
      <span style={{ fontSize: 22, flexShrink: 0 }}>🔍</span>
      <span style={{ fontFamily: F_BODY, fontWeight: 600, fontSize: 16, lineHeight: 1.3 }}>{children}</span>
    </div>
  );
}

// Il volto del mentore: la lente del progetto, con l'occhio vivo
function AvatarLente({ size = 58 }) {
  return (
    <svg viewBox="0 0 130 150" width={size} height={Math.round(size * 150 / 130)} style={{ flexShrink: 0, display: 'block' }}>
      <line x1="44" y1="92" x2="20" y2="138" stroke="#211b12" strokeWidth="12" strokeLinecap="round" />
      <line x1="44" y1="92" x2="20" y2="138" stroke="#f5810d" strokeWidth="4.5" strokeLinecap="round" />
      <circle cx="68" cy="56" r="46" fill="#cfeaf0" stroke="#211b12" strokeWidth="6" />
      <g className="eyelid">
        <circle cx="68" cy="56" r="20" fill="#ffffff" stroke="#211b12" strokeWidth="3.5" />
        <circle className="pupil" cx="68" cy="56" r="10" fill="#211b12" />
        <circle cx="63.5" cy="51.5" r="3.2" fill="#ffffff" />
      </g>
    </svg>
  );
}

// Quando parla il mentore: riquadro con la lente viva
function Mentore({ children, nome = "L'OCCHIO" }) {
  return (
    <div style={{
      display: 'flex', gap: 13, alignItems: 'flex-start', background: '#fff',
      border: `2.5px solid ${C.ink}`, borderRadius: 10, padding: '14px 15px',
      margin: '18px 0', boxShadow: `4px 4px 0 ${C.wax}`,
    }}>
      <AvatarLente />
      <div>
        <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: 1.5, color: C.wax, fontWeight: 700, marginBottom: 4 }}>{nome}</div>
        <div style={{ fontSize: 16, lineHeight: 1.55, color: C.ink }}>{children}</div>
      </div>
    </div>
  );
}

// "Indovina prima di scoprire": scommetti, poi si rivela il fatto
function Indovina({ domanda, opzioni, rivela, accent = C.vangelo }) {
  const [scelto, setScelto] = useState(null);
  return (
    <div style={{ background: C.paper, border: `2px dashed ${accent}`, borderRadius: 8, padding: '16px 18px', margin: '18px 0' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 9, marginBottom: 12 }}>
        <span style={{ flexShrink: 0, marginTop: 1 }}><Icon name="help" size={20} color={accent} /></span>
        <span style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 19, lineHeight: 1.18 }}>{domanda}</span>
      </div>
      {!scelto ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {opzioni.map((o, i) => (
            <button key={i} onClick={() => setScelto(o)} style={{
              textAlign: 'left', background: '#fff', border: `2px solid ${C.line}`, borderRadius: 6,
              padding: '11px 14px', cursor: 'pointer', fontFamily: F_BODY, fontSize: 16, fontWeight: 600, color: C.ink,
            }}>{o.label}</button>
          ))}
        </div>
      ) : (
        <div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 7, marginBottom: 12 }}>
            {opzioni.map((o, i) => {
              const isG = o.giusta, isMine = o === scelto;
              return (
                <div key={i} style={{
                  background: isG ? `${C.storia}1e` : isMine ? `${C.wax}14` : 'transparent',
                  border: `2px solid ${isG ? C.storia : isMine ? C.wax : C.line}`, borderRadius: 6,
                  padding: '10px 14px', fontFamily: F_BODY, fontSize: 15.5, fontWeight: 600,
                  display: 'flex', alignItems: 'center', gap: 8, opacity: (isG || isMine) ? 1 : 0.5,
                }}>
                  {isG && <Icon name="check" size={16} color={C.storia} />}
                  {o.label}
                </div>
              );
            })}
          </div>
          <div style={{ background: '#fff', borderLeft: `4px solid ${accent}`, padding: '12px 16px', borderRadius: '0 6px 6px 0', fontSize: 16, lineHeight: 1.55 }}>
            <strong style={{ color: scelto.giusta ? C.storia : C.wax }}>{scelto.giusta ? 'Esatto, detective! ' : 'Quasi! '}</strong>
            {rivela}
          </div>
        </div>
      )}
    </div>
  );
}

function btnMain(color = C.ink) {
  return {
    background: color, color: C.paper, border: 'none', borderRadius: 4,
    padding: '12px 22px', fontSize: 16, fontWeight: 600, fontFamily: F_BODY,
    cursor: 'pointer', boxShadow: `3px 3px 0 ${C.wax}`,
  };
}
function btnGhost() {
  return {
    background: 'transparent', color: C.ink, border: `1.5px solid ${C.ink}`,
    borderRadius: 4, padding: '10px 18px', fontSize: 15, fontWeight: 500,
    fontFamily: F_BODY, cursor: 'pointer',
  };
}

function NavRow({ goPrev, goNext, nextLabel = 'avanti', hideNext, disableNext }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 28, gap: 12, flexWrap: 'wrap' }}>
      {goPrev ? <button onClick={goPrev} style={btnGhost()}>← indietro</button> : <span />}
      {!hideNext && goNext && (
        <button onClick={goNext} disabled={disableNext} style={{ ...btnMain(), opacity: disableNext ? 0.4 : 1, cursor: disableNext ? 'not-allowed' : 'pointer' }}>
          {nextLabel} →
        </button>
      )}
    </div>
  );
}

// ============================================================================
// APP
// ============================================================================

const SECTIONS = [
  { key: 'caso', kicker: 'FASCICOLO · 01', title: 'Il Caso', icon: 'search' },
  { key: 'prove', kicker: 'FASCICOLO · 02', title: 'Le Prove', icon: 'scroll' },
  { key: 'mondo', kicker: 'FASCICOLO · 03', title: 'Il Mondo di Allora', icon: 'globe' },
  { key: 'dodici', kicker: 'FASCICOLO · 04', title: 'I Dodici', icon: 'users' },
  { key: 'racconti', kicker: 'FASCICOLO · 05', title: 'Quello che Raccontano', icon: 'scroll' },
  { key: 'eredita', kicker: 'FASCICOLO · 06', title: 'Come ha Cambiato il Mondo', icon: 'stamp' },
  { key: 'verdetto', kicker: 'FASCICOLO · 07', title: 'Il Verdetto', icon: 'gavel' },
];

function ProfileSelectView({ profiles, progressByProfile, onSelect, onCreate, onDelete }) {
  const [creating, setCreating] = useState(profiles.length === 0);
  const [name, setName] = useState('');
  const [avatar, setAvatar] = useState(PROFILE_AVATARS[0]);
  const [color, setColor] = useState(PROFILE_COLORS[0]);
  const submit = () => { const clean = name.trim().slice(0, 16); if (clean.length < 1) return; onCreate(clean, avatar, color); };

  return (
    <div style={{ maxWidth: 600, margin: '0 auto' }}>
      <header style={{ textAlign: 'center', padding: '6px 12px 20px' }}>
        <span className="lens" style={{ display: 'inline-block' }}><AvatarLente size={84} /></span>
        <div style={{ fontFamily: F_MONO, fontSize: 11, letterSpacing: 2, color: C.wax, fontWeight: 700, margin: '6px 0 10px' }}>L'OFFICINA DEL TEMPO</div>
        <h1 style={{ fontFamily: F_DISPLAY, fontWeight: 800, fontSize: 'clamp(28px, 5.5vw, 44px)', lineHeight: 1.06, margin: 0 }}>
          Chi indaga <span style={{ fontStyle: 'italic', color: C.wax }}>oggi?</span>
        </h1>
      </header>

      {!creating && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 14, marginBottom: 22 }}>
          {profiles.map(p => {
            const st = profileStats(progressByProfile[p.id]);
            return (
              <div key={p.id} style={{ position: 'relative' }}>
                <button onClick={() => onSelect(p.id)} style={{
                  width: '100%', background: '#fff', border: `2px solid ${C.ink}`, borderRadius: 8,
                  padding: '22px 14px 16px', cursor: 'pointer', boxShadow: `4px 4px 0 ${p.color}`,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8, fontFamily: F_BODY,
                }}>
                  <div style={{ width: 64, height: 64, borderRadius: '50%', background: p.color, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 36, border: `2px solid ${C.ink}` }}>{p.avatar}</div>
                  <div style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 20, color: C.ink }}>{p.name}</div>
                  <div style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft }}>🔍 {st.reperti}/7 indizi</div>
                </button>
                <button onClick={() => { if (window.confirm(`Eliminare il detective ${p.name}? Tutti i suoi progressi andranno persi.`)) onDelete(p.id); }} title="elimina" style={{
                  position: 'absolute', top: -8, right: -8, width: 24, height: 24, borderRadius: '50%',
                  background: C.paper, border: `1.5px solid ${C.line}`, color: C.inkSoft, cursor: 'pointer', fontSize: 13, lineHeight: 1, padding: 0,
                }}>×</button>
              </div>
            );
          })}
          <button onClick={() => { setCreating(true); setName(''); }} style={{
            background: C.paperDeep, border: `2px dashed ${C.inkSoft}`, borderRadius: 8, padding: '22px 14px',
            cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            gap: 8, minHeight: 150, fontFamily: F_BODY, color: C.inkSoft,
          }}>
            <div style={{ fontSize: 36 }}>＋</div>
            <div style={{ fontWeight: 600, fontSize: 15 }}>nuovo detective</div>
          </button>
        </div>
      )}

      {creating && (
        <div style={{ background: '#fff', border: `2px solid ${C.ink}`, borderRadius: 8, boxShadow: `6px 6px 0 ${C.ink}`, padding: '26px 24px', maxWidth: 460, margin: '0 auto' }}>
          <h2 style={{ fontFamily: F_DISPLAY, fontWeight: 800, fontSize: 23, margin: '0 0 16px', textAlign: 'center' }}>Crea il tuo detective</h2>
          <div style={{ textAlign: 'center', marginBottom: 16 }}>
            <div style={{ width: 72, height: 72, borderRadius: '50%', background: color, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 40, border: `2px solid ${C.ink}` }}>{avatar}</div>
          </div>
          <label style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, letterSpacing: 1, fontWeight: 700 }}>IL TUO NOME</label>
          <input type="text" value={name} onChange={e => setName(e.target.value.slice(0, 16))} placeholder="scrivi qui..." autoFocus onKeyDown={e => { if (e.key === 'Enter') submit(); }} style={{
            width: '100%', fontSize: 20, padding: '10px 14px', marginTop: 6, marginBottom: 16, fontFamily: F_DISPLAY, fontWeight: 700,
            background: C.bg, border: `2px solid ${C.ink}`, borderRadius: 6, color: C.ink, outline: 'none',
          }} />
          <label style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, letterSpacing: 1, fontWeight: 700 }}>SCEGLI UN ANIMALE</label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, margin: '6px 0 16px' }}>
            {PROFILE_AVATARS.map(a => (
              <button key={a} onClick={() => setAvatar(a)} style={{ width: 40, height: 40, fontSize: 22, borderRadius: 6, cursor: 'pointer', background: avatar === a ? C.vangelo : C.bg, border: `2px solid ${avatar === a ? C.ink : C.line}` }}>{a}</button>
            ))}
          </div>
          <label style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, letterSpacing: 1, fontWeight: 700 }}>SCEGLI UN COLORE</label>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, margin: '6px 0 22px' }}>
            {PROFILE_COLORS.map(c => (
              <button key={c} onClick={() => setColor(c)} style={{ width: 36, height: 36, borderRadius: '50%', background: c, cursor: 'pointer', border: `3px solid ${color === c ? C.ink : '#fff'}`, boxShadow: `0 0 0 1px ${C.line}` }} />
            ))}
          </div>
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button onClick={submit} disabled={name.trim().length < 1} style={{
              background: C.wax, color: '#fff', border: 'none', borderRadius: 8, padding: '12px 22px', fontFamily: F_BODY, fontWeight: 700, fontSize: 16,
              opacity: name.trim().length < 1 ? 0.4 : 1, cursor: name.trim().length < 1 ? 'default' : 'pointer', boxShadow: `3px 3px 0 ${C.ink}`,
            }}>entra in officina →</button>
            {profiles.length > 0 && (
              <button onClick={() => setCreating(false)} style={{ background: 'transparent', border: `2px solid ${C.line}`, color: C.inkSoft, borderRadius: 8, padding: '12px 20px', fontFamily: F_BODY, fontWeight: 600, fontSize: 15, cursor: 'pointer' }}>← indietro</button>
            )}
          </div>
        </div>
      )}

      <div style={{ marginTop: 26, textAlign: 'center', maxWidth: 480, marginLeft: 'auto', marginRight: 'auto' }}>
        <p style={{ fontSize: 13, color: C.inkSoft, fontStyle: 'italic', lineHeight: 1.5 }}>
          🔒 Ogni detective ha il <strong>suo</strong> taccuino, coi suoi indizi e i suoi casi. Così potete indagare in tanti senza pestarvi i piedi.
        </p>
      </div>
    </div>
  );
}

    <div style={{ maxWidth: 760, margin: '0 auto' }}>

      <div style={{ background: C.paper, border: `3px solid ${C.ink}`, borderRadius: 10, boxShadow: `7px 7px 0 ${C.wax}`, padding: '18px 20px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14, flexWrap: 'wrap', gap: 6 }}>

            <AvatarLente size={18} /> L'OFFICINA DEL TEMPO
          </span>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          <div style={{ width: 76, height: 76, borderRadius: '50%', background: profile ? profile.color : C.wax, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 42, border: `2.5px solid ${C.ink}`, flexShrink: 0 }}>{profile ? profile.avatar : '🔍'}</div>
          <div style={{ flex: '1 1 160px' }}>
            <div style={{ fontFamily: F_DISPLAY, fontWeight: 800, fontSize: 'clamp(24px, 3vw, 32px)', lineHeight: 1.05, color: C.ink }}>{profile ? profile.name : 'Detective'}</div>
            <div style={{ display: 'inline-block', marginTop: 6, fontFamily: F_MONO, fontSize: 12, fontWeight: 700, letterSpacing: 1, color: '#fff', background: C.wax, padding: '4px 11px', borderRadius: 4 }}>{grado.nome.toUpperCase()}</div>

          </div>
        </div>

        <div style={{ marginTop: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, marginBottom: 5 }}>
            <span>INDIZI RACCOLTI</span><span>{tot}/{REPERTI.length}</span>
          </div>
          <div style={{ height: 10, background: C.paperDeep, borderRadius: 5, overflow: 'hidden', border: `1.5px solid ${C.ink}` }}>
            <div style={{ width: `${Math.round(tot / REPERTI.length * 100)}%`, height: '100%', background: C.storia, transition: 'width .4s' }} />
          </div>
        </div>

        <div style={{ marginTop: 16, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          {caso.chiuso ? (
            <span style={{ fontFamily: F_MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: C.storia, border: `2.5px solid ${C.storia}`, borderRadius: 5, padding: '6px 12px', transform: 'rotate(-4deg)', display: 'inline-block' }}>✓ IL FALEGNAME · CASO CHIUSO</span>
          ) : (
            <span style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, fontStyle: 'italic', border: `1.5px dashed ${C.line}`, borderRadius: 5, padding: '6px 12px' }}>nessun caso ancora chiuso — continua a indagare</span>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>

          const attuale = g.nome === grado.nome;
          return (
            <div key={g.nome} style={{
              display: 'flex', alignItems: 'center', gap: 11, padding: '9px 13px', borderRadius: 7,
              background: attuale ? '#fff' : 'transparent',

      {/* ALBUM */}
      <h3 style={{ fontFamily: F_DISPLAY, fontWeight: 800, fontSize: 20, margin: '26px 0 12px', color: C.ink }}>L'Album dei Reperti <span style={{ fontFamily: F_MONO, fontSize: 13, color: C.inkSoft, fontWeight: 400 }}>· {tot}/{REPERTI.length}</span></h3>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 11 }}>
        {REPERTI.map((r, i) => {
          const ok = letti.includes(r.key);
          return (
            <div key={r.key} style={{
              background: ok ? '#fff' : C.paperDeep, border: `2px solid ${ok ? C.ink : C.line}`, borderRadius: 8,
              padding: '13px 14px', boxShadow: ok ? `3px 3px 0 ${C.wax}` : 'none', minHeight: 118, display: 'flex', flexDirection: 'column', gap: 7,
            }}>
              {ok ? (
                <>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontFamily: F_MONO, fontSize: 10, fontWeight: 700, color: '#fff', background: C.storia, borderRadius: 3, padding: '2px 6px' }}>N°{String(i + 1).padStart(2, '0')}</span>
                    <span style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 16, lineHeight: 1.1, color: C.ink }}>{r.nome}</span>
                  </div>
                  <p style={{ margin: 0, fontSize: 13, lineHeight: 1.4, color: C.inkSoft, fontStyle: 'italic' }}>{r.motto}</p>
                </>
              ) : (
                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6, color: C.inkSoft }}>
                  <span style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 30, opacity: 0.5 }}>?</span>
                  <span style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: 1 }}>DA SCOPRIRE</span>
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 14, padding: '14px 16px', border: `2px dashed ${C.line}`, borderRadius: 8, textAlign: 'center', color: C.inkSoft }}>
        <div style={{ fontFamily: F_MONO, fontSize: 11, letterSpacing: 1, fontWeight: 700, marginBottom: 5 }}>IL TACCUINO È SOLO ALL'INIZIO</div>
        <div style={{ fontSize: 13.5, lineHeight: 1.5, fontStyle: 'italic' }}>Hai chiuso il primo caso — ma restano pagine bianche. Ogni nuova indagine porterà altri reperti e altri gradi. Il Maestro Detective è lontano: per ora.</div>
      </div>
    </div>
  );
}

function ToastReperto({ reperto, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, [onClose]);
  return (
    <div onClick={onClose} style={{
      position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)', zIndex: 50,
      display: 'flex', alignItems: 'center', gap: 11, background: C.ink, color: C.paper,
      borderRadius: 12, padding: '11px 17px 11px 12px', boxShadow: '0 10px 30px rgba(0,0,0,.32)', cursor: 'pointer',
      maxWidth: 'calc(100vw - 28px)', animation: 'toastIn .35s ease-out',
    }}>
      <span style={{ background: C.storia, color: '#fff', borderRadius: 8, width: 32, height: 32, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, fontWeight: 700, flexShrink: 0 }}>✓</span>
      <div style={{ lineHeight: 1.2 }}>
        <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: 1.5, color: '#f0c43a' }}>REPERTO TROVATO</div>
        <div style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 16 }}>{reperto.nome}</div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('home'); // 'home' | 'cover' | 'sections' | 'cruscotto'
  const [cruscottoBack, setCruscottoBack] = useState('home'); // da dove sei arrivato al taccuino
  const [idx, setIdx] = useState(0);
  const [store, setStore] = useState(loadStore());

  useEffect(() => { document.body.style.background = C.bg; }, []);
  useEffect(() => { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); }, [idx, view]);

  const activeId = store.activeId;
  const activeProfile = store.profiles.find(p => p.id === activeId) || null;
  const progress = (activeId && store.progressByProfile[activeId]) ? store.progressByProfile[activeId] : freshProgress();

  const markRead = useCallback((key) => {
    setStore(prev => {
      if (!prev.activeId) return prev;
      const cur = prev.progressByProfile[prev.activeId] || freshProgress();
      const caso = cur.casi[CASO_CORRENTE];
      if (caso.letti.includes(key)) return prev;
      const letti = [...caso.letti, key];
      const chiuso = SECTIONS.every(s => letti.includes(s.key));
      const updated = { ...cur, casi: { ...cur.casi, [CASO_CORRENTE]: { ...caso, letti, chiuso } } };
      const next = { ...prev, progressByProfile: { ...prev.progressByProfile, [prev.activeId]: updated } };
      saveStore(next);
      return next;
    });
  }, []);

  const createProfile = useCallback((name, avatar, color) => {
    setStore(prev => {
      const id = makeId();
      const next = { profiles: [...prev.profiles, { id, name, avatar, color, dal: Date.now() }], activeId: id, progressByProfile: { ...prev.progressByProfile, [id]: freshProgress() } };
      saveStore(next);
      return next;
    });
    setView('home');
  }, []);

  const selectProfile = useCallback((id) => {
    setStore(prev => {
      const progressByProfile = prev.progressByProfile[id] ? prev.progressByProfile : { ...prev.progressByProfile, [id]: freshProgress() };
      const next = { ...prev, activeId: id, progressByProfile };
      saveStore(next);
      return next;
    });
    setView('home');
  }, []);

  const switchProfile = useCallback(() => {
    setStore(prev => { const next = { ...prev, activeId: null }; saveStore(next); return next; });
    setView('home');
  }, []);

  const deleteProfile = useCallback((id) => {
    setStore(prev => {
      const pbp = { ...prev.progressByProfile }; delete pbp[id];
      const next = { profiles: prev.profiles.filter(p => p.id !== id), activeId: prev.activeId === id ? null : prev.activeId, progressByProfile: pbp };
      saveStore(next);
      return next;
    });
  }, []);

  const [festa, setFesta] = useState(null);
  const lettiCount = progress.casi[CASO_CORRENTE].letti.length;
  const prevCountRef = useRef(lettiCount);
  const prevIdRef = useRef(activeId);
  useEffect(() => {
    if (prevIdRef.current !== activeId) { prevIdRef.current = activeId; prevCountRef.current = lettiCount; return; }
    if (lettiCount > prevCountRef.current) {
      const letti = progress.casi[CASO_CORRENTE].letti;
      const ultima = letti[letti.length - 1];
      const rep = REPERTI.find(r => r.key === ultima);
      if (rep) setFesta({ reperto: rep, chiuso: progress.casi[CASO_CORRENTE].chiuso });
    }
    prevCountRef.current = lettiCount;
  }, [lettiCount, activeId]);
  const gradoCorrente = ([...GRADI].reverse().find(g => profileStats(progress).reperti >= g.soglia) || GRADI[0]).nome;

  const wrap = {
    background:
      'radial-gradient(circle at 14% 8%, rgba(245,129,13,.13), transparent 40%),' +
      'radial-gradient(circle at 88% 24%, rgba(19,176,161,.12), transparent 42%),' +
      'radial-gradient(circle at 82% 92%, rgba(230,53,37,.10), transparent 46%),' +
      'radial-gradient(#d8c9a4 0.6px, transparent 0.6px), ' + C.bg,
    backgroundSize: '100% 100%, 100% 100%, 100% 100%, 15px 15px, 100% 100%',
    minHeight: '100vh', padding: '24px 16px 60px',
    color: C.ink, fontFamily: F_BODY,
  };

  const topBar = (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 16 }}>
      <a href="index.html" style={{ textDecoration: 'none', color: C.inkSoft, fontFamily: F_BODY, fontSize: 14, display: 'inline-flex', alignItems: 'center', gap: 6 }}>← le officine</a>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
        <button onClick={() => { setCruscottoBack(view); setView('cruscotto'); }} title="la tua patente e i reperti" style={{
          display: 'inline-flex', alignItems: 'center', gap: 5, background: '#fff', border: `2px solid ${C.ink}`,
          borderRadius: 22, padding: '5px 14px 5px 9px', cursor: 'pointer', fontFamily: F_BODY, fontSize: 14, fontWeight: 600, color: C.ink, boxShadow: `2px 2px 0 ${C.ink}`,
        }}><AvatarLente size={19} /> taccuino</button>
        {activeProfile && (
          <button onClick={switchProfile} title="cambia detective" style={{
            display: 'inline-flex', alignItems: 'center', gap: 8, background: '#fff', border: `2px solid ${C.ink}`,
            borderRadius: 22, padding: '4px 13px 4px 5px', cursor: 'pointer', fontFamily: F_BODY, fontSize: 14, boxShadow: `2px 2px 0 ${activeProfile.color}`,
          }}>
            <span style={{ width: 26, height: 26, borderRadius: '50%', background: activeProfile.color, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 15, border: `1.5px solid ${C.ink}` }}>{activeProfile.avatar}</span>
            <span style={{ fontWeight: 700, color: C.ink }}>{activeProfile.name}</span>
            <span style={{ fontFamily: F_MONO, fontSize: 10, color: C.inkSoft, letterSpacing: 0.5 }}>cambia ⇄</span>
          </button>
        )}
      </div>
    </div>
  );

  if (!activeId) {
    return (
      <div style={wrap}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          <div style={{ marginBottom: 8 }}>
            <a href="index.html" style={{ textDecoration: 'none', color: C.inkSoft, fontFamily: F_BODY, fontSize: 14, display: 'inline-flex', alignItems: 'center', gap: 6 }}>← le officine</a>
          </div>
          <ProfileSelectView profiles={store.profiles} progressByProfile={store.progressByProfile} onSelect={selectProfile} onCreate={createProfile} onDelete={deleteProfile} />
        </div>
      </div>
    );
  }

  if (view === 'cruscotto') {
    return (
      <div style={wrap}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          <CruscottoView profile={activeProfile} progress={progress} onBack={() => setView(cruscottoBack)} />
        </div>
      </div>
    );
  }

  if (view === 'home') {
    return (
      <div style={wrap}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          {topBar}
          <ProgettoHome onOpenCaso={() => { setView('cover'); }} read={progress.casi[CASO_CORRENTE].letti.length} />
        </div>
      </div>
    );
  }

  if (view === 'cover') {
    return (
      <div style={wrap}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          {topBar}
          <CoverView onOpen={() => { setView('sections'); setIdx(0); }} onBack={() => setView('home')} read={progress.casi[CASO_CORRENTE].letti.length} />
        </div>
      </div>
    );
  }

  const Section = {
    caso: CasoSection, prove: ProveSection, mondo: MondoSection,
    dodici: DodiciSection, racconti: RaccontiSection, eredita: EreditaSection,
    verdetto: VerdettoSection,
  }[SECTIONS[idx].key];

  return (
    <div style={wrap}>
      <div style={{ maxWidth: 760, margin: '0 auto' }}>
        {festa && festa.chiuso && (
          <FestaCasoChiuso nome={activeProfile ? activeProfile.name : 'Detective'} grado={gradoCorrente}
            onTaccuino={() => { setFesta(null); setCruscottoBack('sections'); setView('cruscotto'); }} onClose={() => setFesta(null)} />
        )}
        {festa && !festa.chiuso && (
          <ToastReperto reperto={festa.reperto} onClose={() => setFesta(null)} />
        )}
        {/* topbar */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <button onClick={() => setView('cover')} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, color: C.inkSoft, fontSize: 14, fontFamily: F_BODY }}>
            <Icon name="arrow-left" size={16} /> il fascicolo
          </button>
          <div style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, letterSpacing: 1.5 }}>
            IL CASO DEL FALEGNAME
          </div>
        </div>

        {/* progress */}
        <div style={{ display: 'flex', gap: 5, marginBottom: 26, justifyContent: 'center', flexWrap: 'wrap' }}>
          {SECTIONS.map((s, i) => (
            <button key={s.key} onClick={() => setIdx(i)} title={s.title} style={{
              width: i === idx ? 30 : 12, height: 12, borderRadius: 6,
              background: i === idx ? C.wax : progress.casi[CASO_CORRENTE].letti.includes(s.key) ? C.storia : C.paperDeep,
              border: `1.5px solid ${i === idx ? C.ink : 'transparent'}`,
              cursor: 'pointer', transition: 'all 0.2s', padding: 0,
            }} />
          ))}
        </div>

        {/* card */}
        <div style={{ background: C.paper, border: `2px solid ${C.ink}`, borderRadius: 4, boxShadow: `6px 6px 0 ${C.ink}`, padding: '34px 30px', minHeight: 440 }}>
          <Section
            markRead={idx === SECTIONS.length - 1 ? () => markRead(SECTIONS[idx].key) : () => {}}
            goNext={() => { if (idx < SECTIONS.length - 1) markRead(SECTIONS[idx].key); setIdx(Math.min(idx + 1, SECTIONS.length - 1)); }}
            goPrev={() => setIdx(Math.max(idx - 1, 0))}
            isLast={idx === SECTIONS.length - 1}
            casoChiuso={progress.casi[CASO_CORRENTE].chiuso}
            nome={activeProfile ? activeProfile.name : 'Detective'}
          />
        </div>
      </div>
    </div>
  );
}

function ProveSection({ markRead, goNext, goPrev }) {
  const cards = [
    { txt: 'Un uomo di nome Gesù è vissuto in Galilea 2000 anni fa.', ans: 'storia', why: 'Quasi tutti gli storici del mondo, credenti e non, sono d\'accordo: è esistito davvero.' },
    { txt: 'Fu condannato e ucciso su una croce dai romani.', ans: 'storia', why: 'È uno dei pochissimi fatti confermati anche da scrittori romani, non solo dai vangeli.' },
    { txt: 'Trasformò l\'acqua in vino a una festa di nozze.', ans: 'vangelo', why: 'È una storia che troviamo nei vangeli. Una testimonianza, non una prova.' },
    { txt: 'Aveva un gruppo di amici stretti chiamati "i Dodici".', ans: 'vangelo', why: 'Lo raccontano i vangeli — anche se, vedrai, sui loro nomi non vanno tutti d\'accordo.' },
    { txt: 'È risorto dalla morte dopo tre giorni.', ans: 'fede', why: 'La storia può dire che morì. Se sia tornato in vita è qualcosa che si crede: nessuna prova può dimostrarlo o smentirlo.' },
    { txt: 'È il figlio di Dio.', ans: 'fede', why: 'Il cuore di ciò che credono i cristiani. Fuori dalla portata della storia, in tutte e due le direzioni.' },
  ];

  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [done, setDone] = useState(false);

  const pick = (k) => {
    if (picked) return;
    setPicked(k);
  };

  const advance = () => {
    if (i + 1 >= cards.length) { setDone(true); markRead(); }
    else { setI(i + 1); setPicked(null); }
  };

  const c = cards[i];
  const correct = picked === c.ans;

  return (
    <div>
      <SectionTitle kicker="FASCICOLO · 02" title="Le Prove" />

      <Mentore>
        Ogni indagine parte dalle prove. Allora partiamo da lì — e ti avviso subito: di prove, su quest'uomo, ne abbiamo meno di quante ne vorresti. Ma è proprio quando scarseggiano che si vede chi sa indagare.
      </Mentore>
      <Hook accent={C.vangelo}>
        Eppure due fatti sono accettati da <strong>quasi tutti</strong> gli storici del mondo, anche quelli che non credono in niente:
        Gesù <strong>è esistito</strong> e <strong>fu crocifisso</strong>. Sembrano pochi? Per uno che non ha lasciato documenti, è già tantissimo.
      </Hook>

      {!done ? (
        <div style={{ marginTop: 20 }}>
          <Mentore>
            La regola dei tre tipi ce l'hai in tasca — è ora di usarla. Di quest'uomo si racconta di tutto: che fu ucciso in croce, che cambiò l'acqua in vino a una festa, che aveva dodici amici fidati, che dopo morto tornò in vita, che è figlio di Dio. Roba grossa, eh? Te le passo una per una. E se non sai dove va una cosa? <strong>Non importa: tira a indovinare col cervello.</strong> Qui non conta sapere, conta ragionare — e sbagliare non costa niente, è così che s'impara a fiutare.
          </Mentore>
          <div style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, letterSpacing: 1.5, marginBottom: 12 }}>PROVA {i + 1} DI {cards.length}</div>
          <div style={{ background: '#fff', border: `2px solid ${C.ink}`, borderRadius: 4, padding: '20px 18px', marginBottom: 14, minHeight: 90, display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center' }}>
            <span style={{ fontFamily: F_DISPLAY, fontWeight: 600, fontSize: 22, lineHeight: 1.25 }}>"{c.txt}"</span>
          </div>

          {!picked ? (
            <div>
              <p style={{ textAlign: 'center', fontSize: 15, color: C.inkSoft, marginBottom: 10, fontStyle: 'italic' }}>Allora, detective — di che tipo è?</p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
                {['storia', 'vangelo', 'fede'].map(k => (
                  <button key={k} onClick={() => pick(k)} style={{
                    background: '#fff', border: `2px solid ${C[k]}`, borderRadius: 4,
                    padding: '12px 6px', cursor: 'pointer', fontFamily: F_MONO, fontWeight: 700,
                    fontSize: 12, color: C[k], letterSpacing: 1,
                  }}>{k.toUpperCase()}</button>
                ))}
              </div>
            </div>
          ) : (
            <div style={{ background: correct ? `${C.storia}15` : `${C.wax}12`, border: `1.5px solid ${correct ? C.storia : C.wax}`, borderRadius: 4, padding: '14px 16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                {correct ? <Icon name="check" size={18} color={C.storia} /> : <Icon name="search" size={16} color={C.wax} />}
                <strong style={{ color: correct ? C.storia : C.wax }}>
                  {correct ? 'Hai visto giusto.' : 'Ci stavi quasi —'}
                </strong>
                <Tag kind={c.ans} small />
              </div>
              <p style={{ margin: 0, fontSize: 15, lineHeight: 1.5 }}>{c.why}</p>
              <button onClick={advance} style={{
                marginTop: 14, background: correct ? C.storia : C.wax, color: '#fff', border: 'none',
                borderRadius: 4, padding: '10px 18px', fontFamily: F_BODY, fontWeight: 600, fontSize: 15, cursor: 'pointer',
              }}>
                {i + 1 >= cards.length ? 'vedi il risultato →' : 'prossima prova →'}
              </button>
            </div>
          )}
        </div>
      ) : (
        <div style={{ marginTop: 20 }}>
          <Mentore nome="L'OCCHIO — caso chiuso">
            <strong style={{ fontFamily: F_DISPLAY, fontSize: 19 }}>Te la cavi, detective.</strong><br />
            Hai fatto esattamente quello che faccio io su ogni caso: prendere ogni affermazione e pesarla, una per una. Quei tre colori ormai ce li hai nell'occhio — e non te li scordi più. Andiamo avanti.
          </Mentore>
        </div>
      )}

      <NavRow goPrev={goPrev} goNext={goNext} nextLabel="il mondo di allora" disableNext={!done} />
    </div>
  );
}

      <SectionTitle kicker="FASCICOLO · 05" title="Quello che Raccontano" />

      <Mentore>

            {docCard('Marco', C.vangelo, same, 'k')}
            {docCard('Luca', C.vangelo, same, 'l')}
          </div>
          <p style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, textAlign: 'center', margin: '7px 0 0' }}>quasi lo stesso testo</p>
        </div>
        <div style={{ flex: '0 1 130px' }}>
          {docCard('Giovanni', C.fede, john, 'g')}
          <p style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkSoft, textAlign: 'center', margin: '7px 0 0' }}>tutt'altra storia</p>
        </div>
      </div>

      <Mentore>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 10, marginTop: 6, marginBottom: 16 }}>

              </div>
              {isOpen && <p style={{ margin: '10px 0 0', fontSize: 15.5, lineHeight: 1.55 }}>{c.a}</p>}
              {!isOpen && <div style={{ fontFamily: F_MONO, fontSize: 9, color: C.inkSoft, letterSpacing: 1, marginTop: 8, marginLeft: 34 }}>TOCCA PER APRIRE →</div>}
            </button>
          );
        })}
      </div>

      <Mentore>
        Vedi cosa intendo? Niente di tutto questo ti chiede di crederci: è successo, e ti gira intorno ogni giorno. Hai visto le prove, i racconti e le leggende. Adesso è ora di tirare le somme.
      </Mentore>

      <NavRow goPrev={goPrev} goNext={goNext} nextLabel="il verdetto" disableNext={open.length < 3} />
    </div>
  );
}

// ============================================================================
// 07 · IL VERDETTO
// ============================================================================

function VerdettoSection({ markRead, goPrev, casoChiuso, nome }) {
  const [aperti, setAperti] = useState(['storia', 'vangelo', 'fede']);
  const [firmati, setFirmati] = useState(casoChiuso ? ['storia', 'vangelo', 'fede'] : []);
  const [dio, setDio] = useState(null);

  const verdetti = [
    { k: 'storia', titolo: 'Cosa sappiamo davvero', txt: 'Poco, ma solido: un uomo chiamato Yeshua è vissuto, ha avuto seguaci, ed è stato crocifisso dai romani. Su questo gli storici di tutto il mondo concordano.' },
    { k: 'vangelo', titolo: 'Cosa raccontano i vangeli', txt: 'Tantissimo: parabole, miracoli, viaggi. Testimonianze scritte decenni dopo, da leggere con la testa del detective — preziose, ma non telecamere.' },
    { k: 'fede', titolo: 'Cosa si crede', txt: 'Che fosse il figlio di Dio, che sia risorto. Miliardi di persone lo credono, miliardi no. La storia, su questo, alza le mani.' },
  ];
  const firma = (k) => setFirmati(p => p.includes(k) ? p : [...p, k]);

  const dioOpz = [
    { id: 'si', label: 'Sì, di sicuro esiste', rivela: 'Tantissime persone lo credono con tutto il cuore. Ma "di sicuro", con le prove, non si può dire: è una delle due trappole — trattare come chiuso ciò che resta aperto.' },
    { id: 'no', label: 'No, di sicuro non esiste', rivela: 'Tante persone la pensano così. Ma anche questo "di sicuro" va oltre ciò che le prove possono dire: è l\'altra trappola, gemella della prima.' },
    { id: 'boh', label: 'Con le prove non si può sapere', detective: true, rivela: 'Qui storia e scienza alzano le mani: né sì né no. Puoi credere o non credere quanto vuoi — ma sapendo che stai scegliendo, non che stai "sapendo". Ed è la cosa più coraggiosa che esista.' },
  ];
  const sc = dioOpz.find(o => o.id === dio);
  const tuttiFirmati = firmati.length === 3;
  useEffect(() => { if (tuttiFirmati) markRead(); }, [tuttiFirmati]);

  return (
    <div>
      <SectionTitle kicker="FASCICOLO · 07" title="Il Verdetto del Detective" />
      <Mentore>
        Caso chiuso? No, detective: caso <em>capito</em>. C'è differenza, e ormai la conosci. Ma il verdetto non lo scrivo io — lo firmi <strong>tu</strong>. E uno solo non basta: un bravo detective ne dà <strong>tre</strong>, uno per ogni colore. Apri ogni cartellino e mettici la tua firma.
      </Mentore>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', background: C.paper, border: `2px solid ${C.ink}`, borderRadius: 8, padding: '12px 16px', marginBottom: 16 }}>
        <span style={{ fontFamily: F_MONO, fontSize: 12, fontWeight: 700, letterSpacing: 1.5, color: C.inkSoft }}>VERDETTI FIRMATI</span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
          {['storia', 'vangelo', 'fede'].map(k => (
            <span key={k} style={{ width: 16, height: 16, borderRadius: '50%', background: firmati.includes(k) ? C[k] : 'transparent', border: `2.5px solid ${firmati.includes(k) ? C[k] : C.line}`, transition: 'all .2s' }} />
          ))}
          <span style={{ fontFamily: F_DISPLAY, fontWeight: 800, fontSize: 18, color: C.ink, marginLeft: 4 }}>{firmati.length}/3</span>
        </span>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 18 }}>
        {verdetti.map(v => {
          const isSigned = firmati.includes(v.k);
          return (
            <div key={v.k} style={{ background: '#fff', border: `2.5px solid ${C.ink}`, borderRadius: 8, boxShadow: `5px 5px 0 ${C[v.k]}`, overflow: 'hidden' }}>
              <div style={{ height: 7, background: C[v.k] }} />
              <div style={{ padding: '15px 17px' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8, flexWrap: 'wrap' }}>
                  <Tag kind={v.k} /> <span style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 18 }}>{v.titolo}</span>
                </div>
                <p style={{ margin: '0 0 14px', fontSize: 16, lineHeight: 1.55, color: C.ink }}>{v.txt}</p>
                {!isSigned ? (
                  <button onClick={() => firma(v.k)} style={{
                    background: C[v.k], color: '#fff', border: 'none', borderRadius: 6,
                    padding: '10px 18px', fontFamily: F_BODY, fontWeight: 700, fontSize: 15, cursor: 'pointer', boxShadow: `3px 3px 0 ${C.ink}`,
                  }}>firma qui &rarr;</button>
                ) : (
                  <div style={{ borderTop: `1.5px dashed ${C.line}`, paddingTop: 8, display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
                    <span style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: 1, color: C.inkSoft }}>FIRMATO DAL DETECTIVE</span>
                    <span style={{ fontFamily: F_HAND, fontSize: 30, fontWeight: 700, color: C[v.k], transform: 'rotate(-3deg)', lineHeight: 1 }}>{nome}</span>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {firmati.length > 0 && !tuttiFirmati && (
        <Mentore>
          {firmati.length === 1
            ? 'Una firma, bene. Ma un bravo detective non si ferma a un colore solo: ne mancano ancora due.'
            : 'Ci sei quasi — manca l\u2019ultima firma, e il caso è tuo.'}
        </Mentore>
      )}

      {tuttiFirmati && (
        <div style={{ background: C.ink, color: C.paper, borderRadius: 8, padding: '20px 22px', margin: '4px 0 20px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
            <Icon name="help" size={20} color={C.paper} />
            <span style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 23 }}>"Ma allora… Dio esiste?"</span>
          </div>
          <p style={{ margin: '0 0 14px', fontSize: 16, lineHeight: 1.55, color: '#f0e6d0' }}>
            Prima o poi questa domanda arriva. Prova a rispondere tu: secondo te un detective — con prove, storia e scienza — <em>può</em> dare la risposta?
          </p>
          {!dio ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {dioOpz.map(o => (
                <button key={o.id} onClick={() => setDio(o.id)} style={{
                  textAlign: 'left', background: 'rgba(255,255,255,.08)', border: '2px solid rgba(255,255,255,.35)',
                  color: C.paper, borderRadius: 6, padding: '12px 14px', cursor: 'pointer', fontFamily: F_BODY, fontSize: 16, fontWeight: 600,
                }}>{o.label}</button>
              ))}
            </div>
          ) : (
            <div>
              <div style={{ background: sc.detective ? 'rgba(67,164,86,.22)' : 'rgba(245,129,13,.16)', border: `2px solid ${sc.detective ? C.storia : C.vangelo}`, borderRadius: 6, padding: '14px 16px', marginBottom: 10 }}>
                <strong style={{ color: sc.detective ? '#8fe0a0' : '#ffcf8a' }}>{sc.detective ? 'Hai pensato da detective.' : 'Attento alla trappola.'}</strong>
                <p style={{ margin: '6px 0 0', fontSize: 15.5, lineHeight: 1.55, color: '#f0e6d0' }}>{sc.rivela}</p>
              </div>
              {!sc.detective && (
                <button onClick={() => setDio('boh')} style={{
                  background: 'transparent', border: '1.5px solid rgba(255,255,255,.45)', color: C.paper,
                  borderRadius: 5, padding: '9px 15px', cursor: 'pointer', fontFamily: F_BODY, fontSize: 14, fontWeight: 600,
                }}>e la risposta da detective qual è? →</button>
              )}
            </div>
          )}
        </div>
      )}

      {tuttiFirmati && (
        <div style={{ textAlign: 'center', margin: '6px 0 22px' }}>
          <p style={{ fontFamily: F_DISPLAY, fontWeight: 700, fontStyle: 'italic', fontSize: 'clamp(21px, 3.6vw, 28px)', lineHeight: 1.22, color: C.ink, margin: 0 }}>
            Sapere non è un'arma per stare sopra agli altri.<br />È un paio di occhiali per vedere meglio.
          </p>
        </div>
      )}

      {tuttiFirmati && (
        <Mentore>
          E con questo, detective, il mio lavoro qui finisce. Ti ho insegnato a guardare — a non fare mai di tutta l'erba un fascio, a chiederti sempre <em>come faccio a saperlo davvero?</em> Il resto tocca a te. Io l'occhio lo tengo aperto: sai dove trovarmi.
        </Mentore>
      )}

      {tuttiFirmati && (
        <div style={{ background: C.paper, border: `2px dashed ${C.line}`, borderRadius: 8, padding: '20px 22px', margin: '4px 0 16px' }}>
          <div style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 22, marginBottom: 3 }}>Hai chiuso il caso. E adesso?</div>
          <p style={{ margin: '0 0 16px', fontSize: 15, color: C.inkSoft, fontStyle: 'italic' }}>Un detective non si ferma mai. Tre modi per continuare a indagare.</p>

          <div style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: F_MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: C.storia, textTransform: 'uppercase', marginBottom: 6 }}>Controlla il mio lavoro</div>
            <p style={{ margin: '0 0 9px', fontSize: 15.5, lineHeight: 1.5 }}>Non credermi sulla parola: sarebbe la trappola più sciocca. Ogni cosa che hai letto in questo caso ha una fonte vera &mdash; e puoi andare a vederla tu stesso.</p>
            <a href="fonti.html" style={{ display: 'inline-block', fontFamily: F_MONO, fontSize: 13, fontWeight: 700, letterSpacing: .5, color: C.ink, background: C.vangelo, textDecoration: 'none', borderRadius: 5, padding: '8px 14px' }}>&rarr; Tutte le fonti, una per una</a>
          </div>

          <div style={{ marginBottom: 16 }}>
            <div style={{ fontFamily: F_MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: C.vangelo, textTransform: 'uppercase', marginBottom: 6 }}>Da leggere</div>
            <p style={{ margin: '0 0 8px', fontSize: 15, lineHeight: 1.5 }}><strong>Scava con Archeokids</strong> (Editoriale Scienza) &mdash; scritto da archeologi veri: come si scopre il passato scavando, strato dopo strato. <span style={{ color: C.inkSoft }}>Da 8 anni.</span></p>
            <p style={{ margin: 0, fontSize: 15, lineHeight: 1.5 }}><strong>Fake. Non &egrave; vero ma ci credo</strong>, di Daniele Aristarco (Einaudi Ragazzi) &mdash; come si smaschera una bugia spacciata per vera. <span style={{ color: C.inkSoft }}>Per i pi&ugrave; grandi, dai 10.</span></p>
          </div>

          <div>
            <div style={{ fontFamily: F_MONO, fontSize: 11, fontWeight: 700, letterSpacing: 1, color: C.fede, textTransform: 'uppercase', marginBottom: 6 }}>Da fare, senza libri</div>
            <ul style={{ margin: 0, paddingLeft: 19, fontSize: 15, lineHeight: 1.65 }}>
              <li>La prossima volta che qualcuno ti racconta qualcosa di sicuro, chiediti: <em>&laquo;chi lo dice, e come fa a saperlo?&raquo;</em></li>
              <li>In un museo, cerca un oggetto vero di duemila anni fa: quello &egrave; una <em>prova</em> che ha attraversato il tempo.</li>
              <li>Prendi una storia che sai a memoria e prova a dividerla nei tre colori: cosa <em>sai</em>, cosa ti <em>raccontano</em>, cosa <em>credi</em>.</li>
            </ul>
          </div>
        </div>
      )}

      <div style={{ background: C.paper, border: `2px solid ${C.ink}`, borderRadius: 8, padding: '18px 20px', textAlign: 'center' }}>
        <div style={{ fontFamily: F_DISPLAY, fontWeight: 900, fontSize: 26, marginBottom: 8 }}>Il caso è tuo, adesso.</div>
        <p style={{ margin: '0 0 14px', fontSize: 16, lineHeight: 1.55 }}>
          Quella di Gesù è solo <strong>una</strong> delle grandi storie che gli esseri umani si raccontano da migliaia di anni.
          Ce ne sono tante altre, tutte da indagare con gli stessi tre colori:
        </p>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center' }}>
          {['Gli dèi greci', 'I miti dei vichinghi', 'I fiumi sacri dell\'India', 'Il profeta del deserto', 'Le storie d\'Egitto'].map(s => (
            <span key={s} style={{ background: C.bg, border: `1.5px solid ${C.line}`, borderRadius: 20, padding: '6px 14px', fontSize: 14, fontFamily: F_BODY }}>{s}</span>
          ))}
        </div>
        <p style={{ margin: '16px 0 0', fontSize: 15, fontStyle: 'italic', color: C.inkSoft }}>
          Capire cosa credono gli altri è il modo migliore per stare al mondo insieme a loro.
        </p>
      </div>

      <NavRow goPrev={goPrev} hideNext />
    </div>
  );
}

// ============================================================================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
