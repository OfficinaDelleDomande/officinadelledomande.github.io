<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #f5efe0;
    color: #1a2540;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }
  input { font-family: inherit; }
  @media (max-width: 600px) {
    .card-grid { grid-template-columns: 1fr !important; }
  }
  @keyframes oaBlink { 0%,90%,100%{transform:scaleY(0)} 95%{transform:scaleY(1)} }
  @keyframes oaGaze { 0%,100%{transform:translate(0,0)} 30%{transform:translate(1.6px,-1.2px)} 62%{transform:translate(-1.6px,.8px)} }
  @keyframes oaPulse { 0%,100%{opacity:1} 50%{opacity:.15} }
  @keyframes oaFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  .oa-lid { transform-box:fill-box; transform-origin:top; animation:oaBlink 4.2s infinite; }
  .oa-look { transform-box:fill-box; animation:oaGaze 6s ease-in-out infinite; }
  .oa-px { animation:oaPulse 1.9s ease-in-out infinite; }
  .oa-float { transform-box:fill-box; animation:oaFloat 4.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .oa-lid,.oa-look,.oa-px,.oa-float { animation:none; } }
  @keyframes reveal { from{ opacity:0; transform:translateY(12px) scale(.97) } to{ opacity:1; transform:none } }
  .reveal-pop{ animation:reveal .45s cubic-bezier(.2,.7,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .reveal-pop{ animation:none; } }
</style>

      answer: ch,
      binary: letterToBinary(ch),
      options
    });
  }
  return rounds;
}
