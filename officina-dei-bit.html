  return (

      {paths}
    </svg>

// ============================================================================
// UTILITY
// ============================================================================

function letterToBinary(char) {
  return char.charCodeAt(0).toString(2).padStart(8, '0');
}

function normalize(char) {
  return char.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}

function generateDecodeRounds() {
  const pool = 'ABCDEFGHILMNOPRSTUV';
  const rounds = [];
  const used = new Set();
  while (rounds.length < 6) {
    const ch = pool[Math.floor(Math.random() * pool.length)];
    if (used.has(ch)) continue;
    used.add(ch);
    const distractors = new Set();
    while (distractors.size < 3) {
      const d = pool[Math.floor(Math.random() * pool.length)];
      if (d !== ch) distractors.add(d);
    }
    const options = [ch, ...Array.from(distractors)].sort(() => Math.random() - 0.5);
    rounds.push({ answer: ch, binary: letterToBinary(ch), options });
  }
  return rounds;
}

// ============================================================================
// PERSISTENT STORAGE (localStorage) — MULTI-PROFILO
// ============================================================================

const STORE_KEY = 'officina-bit-store-v2';
const OLD_KEY = 'officina-bit-progress-v1';

const PROFILE_COLORS = ['#e8a317', '#4a8a5c', '#c0432a', '#2d7dd2', '#9b59b6', '#e91e8c'];
const PROFILE_AVATARS = ['🦊', '🐱', '🐯', '🦉', '🐢', '🦄', '🐙', '🦁', '🐧', '🦋'];

function makeId() {
  return 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function freshProgress() {
  return {
    module1: { pagesDone: [], userName: '', bestDecode: 0 },
    module2: { pagesDone: [] },
    module3: { pagesDone: [], pixelArt: null },
    module4: { pagesDone: [] },
  };
}

const MODULE_KEYS = ['module1', 'module2', 'module3', 'module4'];
const PAGES_PER_MODULE = 7;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return {
        profiles: p.profiles || [],
        activeId: p.activeId || null,
        progressByProfile: p.progressByProfile || {},
      };
    }
    // Migrazione dal vecchio schema a profilo singolo
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const oldProg = { ...freshProgress(), ...JSON.parse(old) };
      const id = makeId();
      const name = (oldProg.module1 && oldProg.module1.userName) ? oldProg.module1.userName : 'Esploratore';
      return {
        profiles: [{ id, name, avatar: PROFILE_AVATARS[0], color: PROFILE_COLORS[0] }],
        activeId: null,
        progressByProfile: { [id]: oldProg },
      };
    }
  } catch (e) { /* ignora */ }
  return { profiles: [], activeId: null, progressByProfile: {} };
}

function saveStore(store) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignora */ }
}

// ============================================================================
// APP
// ============================================================================

function App() {
  const [view, setView] = useState('hub');
  const [module1Page, setModule1Page] = useState(0);
  const [module2Page, setModule2Page] = useState(0);
  const [module3Page, setModule3Page] = useState(0);
  const [module4Page, setModule4Page] = useState(0);
  const [store, setStore] = useState(loadStore());

  const activeId = store.activeId;
  const activeProfile = store.profiles.find(p => p.id === activeId) || null;
  const progress = (activeId && store.progressByProfile[activeId]) ? store.progressByProfile[activeId] : freshProgress();

  // Aggiorna il progress del profilo attivo
  const updateProgress = useCallback((updater) => {
    setStore(prev => {
      if (!prev.activeId) return prev;
      const cur = prev.progressByProfile[prev.activeId] || freshProgress();
      const updated = updater(cur);
      const next = { ...prev, progressByProfile: { ...prev.progressByProfile, [prev.activeId]: updated } };
      saveStore(next);
      return next;
    });
  }, []);

  const markPageDone = useCallback((moduleKey, pageIdx) => {
    updateProgress(prog => {
      const done = new Set(prog[moduleKey].pagesDone);
      done.add(pageIdx);
      return { ...prog, [moduleKey]: { ...prog[moduleKey], pagesDone: Array.from(done) } };
    });
  }, [updateProgress]);

  const updateUserName = useCallback((name) => {
    updateProgress(prog => ({ ...prog, module1: { ...prog.module1, userName: name } }));
  }, [updateProgress]);

  const updateBestDecode = useCallback((score) => {
    updateProgress(prog => (score <= prog.module1.bestDecode ? prog : { ...prog, module1: { ...prog.module1, bestDecode: score } }));
  }, [updateProgress]);

  const updatePixelArt = useCallback((art) => {
    updateProgress(prog => ({ ...prog, module3: { ...prog.module3, pixelArt: art } }));
  }, [updateProgress]);

  const resetModule = useCallback((key) => {
    updateProgress(prog => ({ ...prog, [key]: freshProgress()[key] }));
  }, [updateProgress]);

  // --- Gestione profili ---
  const createProfile = useCallback((name, avatar, color) => {
    setStore(prev => {
      const id = makeId();
      const next = {
        profiles: [...prev.profiles, { id, name, avatar, color }],
        activeId: id,
        progressByProfile: { ...prev.progressByProfile, [id]: freshProgress() },
      };
      saveStore(next);
      return next;
    });
    setView('hub');
  }, []);

  const selectProfile = useCallback((id) => {
    setStore(prev => {
      const progressByProfile = prev.progressByProfile[id]
        ? prev.progressByProfile
        : { ...prev.progressByProfile, [id]: freshProgress() };
      const next = { ...prev, activeId: id, progressByProfile };
      saveStore(next);
      return next;
    });
    setView('hub');
  }, []);

  const switchProfile = useCallback(() => {
    setStore(prev => {
      const next = { ...prev, activeId: null };
      saveStore(next);
      return next;
    });
    setView('hub');
  }, []);

  const deleteProfile = useCallback((id) => {
    setStore(prev => {
      const progressByProfile = { ...prev.progressByProfile };
      delete progressByProfile[id];
      const next = {
        profiles: prev.profiles.filter(p => p.id !== id),
        activeId: prev.activeId === id ? null : prev.activeId,
        progressByProfile,
      };
      saveStore(next);
      return next;
    });
  }, []);

  return (
    <div style={{
      background: PALETTE.cream,
      backgroundImage: `radial-gradient(${PALETTE.paperLine} 1px, transparent 1px)`,
      backgroundSize: '24px 24px',
      backgroundPosition: '0 0',
      minHeight: '100vh',
      fontFamily: FONT_BODY,
      color: PALETTE.ink,
      padding: '24px 16px 60px',
    }}>
      <div style={{ maxWidth: 880, margin: '0 auto' }}>
        {!activeId && (
          <ProfileSelectView
            profiles={store.profiles}
            progressByProfile={store.progressByProfile}
            onSelect={selectProfile}
            onCreate={createProfile}
            onDelete={deleteProfile}
          />
        )}
        {activeId && view === 'hub' && (
          <HubView
            progress={progress}
            activeProfile={activeProfile}
            onSwitchProfile={switchProfile}
            onEnterModule1={() => { setView('module1'); setModule1Page(0); }}
            onEnterModule2={() => { setView('module2'); setModule2Page(0); }}
            onEnterModule3={() => { setView('module3'); setModule3Page(0); }}
            onEnterModule4={() => { setView('module4'); setModule4Page(0); }}
          />
        )}
        {activeId && view === 'module1' && (
          <ModuleOneView
            page={module1Page}
            setPage={setModule1Page}
            progress={progress}
            markPageDone={(idx) => markPageDone('module1', idx)}
            onResetModule={() => { resetModule('module1'); setModule1Page(0); }}
            updateUserName={updateUserName}
            updateBestDecode={updateBestDecode}
            onExit={() => setView('hub')}
          />
        )}
        {activeId && view === 'module2' && (
          <ModuleTwoView
            page={module2Page}
            setPage={setModule2Page}
            progress={progress}
            markPageDone={(idx) => markPageDone('module2', idx)}
            onResetModule={() => { resetModule('module2'); setModule2Page(0); }}
            onExit={() => setView('hub')}
          />
        )}
        {activeId && view === 'module3' && (
          <ModuleThreeView
            page={module3Page}
            setPage={setModule3Page}
            progress={progress}
            markPageDone={(idx) => markPageDone('module3', idx)}
            onResetModule={() => { resetModule('module3'); setModule3Page(0); }}
            updatePixelArt={updatePixelArt}
            onExit={() => setView('hub')}
          />
        )}
        {activeId && view === 'module4' && (
          <ModuleFourView
            page={module4Page}
            setPage={setModule4Page}
            progress={progress}
            markPageDone={(idx) => markPageDone('module4', idx)}
            onResetModule={() => { resetModule('module4'); setModule4Page(0); }}
            onExit={() => setView('hub')}
          />
        )}
      </div>
    </div>
  );
}

// ============================================================================
// SELEZIONE PROFILI
// ============================================================================

function profileStats(prog) {
  const p = prog || freshProgress();
  let modulesDone = 0;
  MODULE_KEYS.forEach(k => {
    const n = (p[k] && p[k].pagesDone) ? p[k].pagesDone.length : 0;
    if (n >= PAGES_PER_MODULE) modulesDone++;
  });
  return { modulesDone, total: MODULE_KEYS.length };
}

function ProfileSelectView({ profiles, progressByProfile, onSelect, onCreate, onDelete }) {
  const [creating, setCreating] = useState(profiles.length === 0);
  const [name, setName] = useState('');
  const [avatar, setAvatar] = useState(PROFILE_AVATARS[0]);
  const [color, setColor] = useState(PROFILE_COLORS[0]);

  const submit = () => {
    const clean = name.trim().slice(0, 16);
    if (clean.length < 1) return;
    onCreate(clean, avatar, color);
  };

  return (
    <div>
      <header style={{ textAlign: 'center', padding: '32px 12px 28px' }}>
        <div style={{
          display: 'inline-block', padding: '4px 14px', background: PALETTE.ink, color: PALETTE.cream,
          fontFamily: FONT_MONO, fontSize: 12, letterSpacing: 2, marginBottom: 20, borderRadius: 2,
        }}>
          L'OFFICINA DEI BIT
        </div>
        <h1 style={{ fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 'clamp(32px, 6vw, 50px)', lineHeight: 1.05, margin: 0, letterSpacing: '-0.02em' }}>
          Chi sta esplorando<br /><span style={{ fontStyle: 'italic', fontWeight: 500, color: PALETTE.amber }}>oggi?</span>
        </h1>
      </header>

      {!creating && (
        <div>
          <div className="card-grid" style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(150px, 1fr))', gap: 14, marginBottom: 24 }}>
            {profiles.map(p => {
              const st = profileStats(progressByProfile[p.id]);
              return (
                <div key={p.id} style={{ position: 'relative' }}>
                  <button onClick={() => onSelect(p.id)} style={{
                    width: '100%', background: '#fff', border: `2px solid ${PALETTE.ink}`,
                    borderRadius: 8, padding: '22px 14px 16px', cursor: 'pointer',
                    boxShadow: `4px 4px 0 ${p.color}`, display: 'flex', flexDirection: 'column',
                    alignItems: 'center', gap: 8, fontFamily: FONT_BODY,
                  }}>
                    <div style={{
                      width: 64, height: 64, borderRadius: '50%', background: p.color,
                      display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 36,
                      border: `2px solid ${PALETTE.ink}`,
                    }}>{p.avatar}</div>
                    <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 20, color: PALETTE.ink }}>{p.name}</div>
                    <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: PALETTE.inkSoft }}>
                      🏅 {st.modulesDone}/{st.total} moduli
                    </div>
                  </button>
                  <button
                    onClick={() => { if (window.confirm(`Eliminare il profilo di ${p.name}? Tutti i suoi progressi andranno persi.`)) onDelete(p.id); }}
                    title="elimina profilo"
                    style={{
                      position: 'absolute', top: -8, right: -8, width: 24, height: 24, borderRadius: '50%',
                      background: PALETTE.cream, border: `1.5px solid ${PALETTE.warmGray}`, color: PALETTE.inkSoft,
                      cursor: 'pointer', fontSize: 13, lineHeight: 1, padding: 0,
                    }}
                  >×</button>
                </div>
              );
            })}

            {/* Nuovo profilo */}
            <button onClick={() => { setCreating(true); setName(''); }} style={{
              background: PALETTE.creamDeep, border: `2px dashed ${PALETTE.inkSoft}`,
              borderRadius: 8, padding: '22px 14px', cursor: 'pointer',
              display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
              gap: 8, minHeight: 150, fontFamily: FONT_BODY, color: PALETTE.inkSoft,
            }}>
              <div style={{ fontSize: 36 }}>＋</div>
              <div style={{ fontWeight: 600, fontSize: 15 }}>nuovo detective</div>
            </button>
          </div>
        </div>
      )}

      {creating && (
        <div style={{ background: '#fff', border: `2px solid ${PALETTE.ink}`, borderRadius: 8, boxShadow: `6px 6px 0 ${PALETTE.ink}`, padding: '28px 26px', maxWidth: 460, margin: '0 auto' }}>
          <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 24, margin: '0 0 18px', textAlign: 'center' }}>
            Crea il tuo profilo
          </h2>

          {/* Anteprima */}
          <div style={{ textAlign: 'center', marginBottom: 18 }}>
            <div style={{
              width: 72, height: 72, borderRadius: '50%', background: color, margin: '0 auto',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 40,
              border: `2px solid ${PALETTE.ink}`,
            }}>{avatar}</div>
          </div>

          <label style={{ fontFamily: FONT_MONO, fontSize: 11, color: PALETTE.inkSoft, letterSpacing: 1, fontWeight: 700 }}>IL TUO NOME</label>
          <input

function LightbulbsPage({ markDone, goNext, goPrev }) {
  const [bits, setBits] = useState([0, 0, 0, 0, 0, 0, 0, 0]);
  const values = [128, 64, 32, 16, 8, 4, 2, 1];
  const total = bits.reduce((sum, b, i) => sum + (b ? values[i] : 0), 0);

  const [challengeTarget, setChallengeTarget] = useState(13);
  const [challengesWon, setChallengesWon] = useState([]);

  const toggle = (i) => setBits(prev => {
    const next = [...prev];
    next[i] = next[i] ? 0 : 1;
    return next;
  });

  const reset = () => setBits([0, 0, 0, 0, 0, 0, 0, 0]);

  useEffect(() => {
    if (total === challengeTarget && !challengesWon.includes(challengeTarget)) {
      setChallengesWon(prev => [...prev, challengeTarget]);
    }
  }, [total, challengeTarget]);

  useEffect(() => {
    if (challengesWon.length >= 2) markDone();
  }, [challengesWon]);

  const challenges = [13, 25, 7, 42, 100];
  const remaining = challenges.filter(c => !challengesWon.includes(c));

  const tryNewChallenge = () => {
    if (remaining.length > 0) {
      setChallengeTarget(remaining[0]);
      reset();
    }
  };

  return (
    <div>
      <PageHeader eyebrow="Pagina 2 di 7" title="Le 8 lampadine" />
      <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 8 }}>
        Ogni lampadina ha un <strong>valore</strong>. Accendile e <strong>somma</strong> i loro valori per fare un numero.
      </p>
      <p style={{ fontSize: 15, color: PALETTE.inkSoft, marginBottom: 24 }}>
        Tocca le lampadine per accenderle o spegnerle.
      </p>

      <div style={{
        background: PALETTE.cream, border: `1.5px solid ${PALETTE.paperLine}`,
        borderRadius: 6, padding: '24px 12px 18px', marginBottom: 20,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-around', alignItems: 'flex-end', gap: 4, flexWrap: 'wrap' }}>
          {bits.map((b, i) => (
            <Lightbulb8 key={i} on={b === 1} value={values[i]} onClick={() => toggle(i)} />
          ))}
        </div>

        <div style={{ marginTop: 22, textAlign: 'center' }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.inkSoft, letterSpacing: 2, marginBottom: 2 }}>
            NUMERO CHE HAI FATTO:
          </div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 56, lineHeight: 1, color: PALETTE.ink }}>
            {total}
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 16, color: PALETTE.amber, marginTop: 6 }}>
            {bits.join('')}
          </div>
        </div>
      </div>

      <div style={{
        background: challengesWon.includes(challengeTarget) ? `${PALETTE.moss}15` : PALETTE.creamDeep,
        border: `2px solid ${challengesWon.includes(challengeTarget) ? PALETTE.moss : PALETTE.ink}`,
        borderRadius: 4, padding: '16px 18px', marginBottom: 18,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: 1.5, color: PALETTE.inkSoft, fontWeight: 700 }}>
            ░ SFIDA ░
          </span>
          <span style={{ fontSize: 12, color: PALETTE.inkSoft }}>
            sfide vinte: {challengesWon.length} / {challenges.length}
          </span>
        </div>
        {challengesWon.includes(challengeTarget) ? (
          <div>
            <div style={{ fontSize: 18, color: PALETTE.moss, fontWeight: 600, marginBottom: 8 }}>
              <Icon name="check-circle" size={20} style={{ verticalAlign: 'middle', marginRight: 6 }} />
              Bravissimo! Hai fatto {challengeTarget}.
            </div>
            {remaining.length > 0 ? (
              <button onClick={tryNewChallenge} style={btnPrimary()}>prossima sfida →</button>
            ) : (
              <div style={{ fontSize: 16, color: PALETTE.ink, marginTop: 6 }}>🏆 Hai vinto tutte le sfide!</div>
            )}
          </div>
        ) : (
          <div style={{ fontSize: 17 }}>
            Riesci a fare il numero <strong style={{ fontSize: 22, color: PALETTE.amber }}>{challengeTarget}</strong>?
            <button onClick={reset} style={{ ...btnGhost(), marginLeft: 10, fontSize: 13 }}>
              <Icon name="rotate-ccw" size={12} style={{ display: 'inline-block', marginRight: 4, verticalAlign: 'middle' }} />
              spegni tutte
            </button>
          </div>
        )}
      </div>

      <div style={{ fontSize: 14, color: PALETTE.inkSoft, fontStyle: 'italic', marginBottom: 20 }}>
        💡 <strong>Suggerimento:</strong> per fare 13, cerca le lampadine che sommate fanno 13. Tipo 8+4+1 = 13!
      </div>

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="conta con le dita →" />
    </div>
  );
}

  const [fingers, setFingers] = useState([0, 0, 0, 0, 0]);
  const values = [1, 2, 4, 8, 16];
  const names = ['Pollice', 'Indice', 'Medio', 'Anulare', 'Mignolo'];
  const total = fingers.reduce((sum, f, i) => sum + (f ? values[i] : 0), 0);

  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    if (total >= 16 && revealed) markDone();
  }, [total, revealed]);

  const toggle = (i) => setFingers(prev => {
    const next = [...prev];
    next[i] = next[i] ? 0 : 1;
    return next;
  });

  return (
    <div>
      <PageHeader eyebrow="Pagina 3 di 7" title="Conta con le dita" />
      <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 10 }}>
        Con una mano sola si conta fino a <strong>5</strong>, vero?<br />
        I computer userebbero la stessa mano per contare fino a <strong style={{ color: PALETTE.amber, fontSize: 22 }}>31</strong>.
      </p>
      <p style={{ fontSize: 16, color: PALETTE.inkSoft, marginBottom: 24 }}>
        Tocca le dita per alzarle o abbassarle.
      </p>

      <div style={{
        background: PALETTE.cream, border: `1.5px solid ${PALETTE.paperLine}`,
        borderRadius: 6, padding: '22px 16px 18px', marginBottom: 20,
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'flex-end', gap: 10, flexWrap: 'wrap' }}>
          {fingers.map((f, i) => (
            <FingerToggle key={i} up={f === 1} value={values[i]} name={names[i]} onClick={() => toggle(i)} />
          ))}
        </div>

        <div style={{ marginTop: 22, textAlign: 'center' }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 13, color: PALETTE.inkSoft, letterSpacing: 2, marginBottom: 2 }}>
            NUMERO:
          </div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 54, lineHeight: 1, color: PALETTE.ink }}>
            {total}
          </div>
        </div>
      </div>

        background: PALETTE.creamDeep, border: `2px solid ${PALETTE.ink}`,
        borderRadius: 4, padding: '16px 18px', marginBottom: 18,
      }}>
        <div style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: 1.5, color: PALETTE.inkSoft, fontWeight: 700, marginBottom: 8 }}>
          ░ SFIDA ░
        </div>
        <p style={{ margin: 0, fontSize: 16 }}>
          Prova ad alzare <strong>tutte e 5 le dita</strong>. Che numero viene?
        </p>
        {total === 31 && (
          <div style={{ marginTop: 12, color: PALETTE.moss, fontSize: 16, fontWeight: 600 }}>
            <Icon name="check-circle" size={18} style={{ verticalAlign: 'middle', marginRight: 6 }} />
            31! Sei riuscito a contare fino a 31 con una mano sola.
          </div>
        )}
      </div>

      <button onClick={() => setRevealed(true)} style={{ ...btnGhost(), marginBottom: 16 }}>
        {revealed ? '🤯 Curiosità rivelata' : 'Vuoi sapere quanto si conta con DUE mani?'}
      </button>

      {revealed && (
        <div style={{
          background: `${PALETTE.amber}15`,
          border: `1.5px dashed ${PALETTE.amber}`,
          padding: '16px 18px', borderRadius: 4, marginBottom: 20,

          <p style={{ margin: 0, fontSize: 17 }}>

function DecodePage({ markDone, goNext, goPrev, progress, updateBestDecode }) {
  const [rounds, setRounds] = useState(() => generateDecodeRounds());
  const [roundIdx, setRoundIdx] = useState(0);
  const [score, setScore] = useState(0);
  const [feedback, setFeedback] = useState(null);
  const [finished, setFinished] = useState(false);

  const round = rounds[roundIdx];

  const handleAnswer = (choice) => {
    if (feedback) return;
    const correct = choice === round.answer;
    setFeedback(correct ? 'right' : 'wrong');
    if (correct) setScore(s => s + 1);
    setTimeout(() => {
      setFeedback(null);
      if (roundIdx + 1 >= rounds.length) {
        setFinished(true);
        const finalScore = score + (correct ? 1 : 0);
        updateBestDecode(finalScore);
        if (finalScore >= 4) markDone();
      } else {
        setRoundIdx(roundIdx + 1);
      }
    }, 900);
  };

  const restart = () => {
    setRounds(generateDecodeRounds());
    setRoundIdx(0);
    setScore(0);
    setFinished(false);
    setFeedback(null);
  };

  return (
    <div>
      <PageHeader eyebrow="Pagina 5 di 7" title="Decifra il messaggio" />

      {!finished && (
        <>
          <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 8 }}>
            Quale lettera si nasconde dietro questi 0 e 1?
          </p>
          <p style={{ fontSize: 14, color: PALETTE.inkSoft, marginBottom: 22 }}>
            Round {roundIdx + 1} di {rounds.length} · punteggio: {score}
          </p>

          <div style={{
            background: PALETTE.ink, borderRadius: 6,
            padding: '32px 16px', textAlign: 'center', marginBottom: 28,
          }}>
            <div style={{
              fontFamily: FONT_MONO,
              fontSize: 'clamp(28px, 6vw, 44px)',
              fontWeight: 700, color: PALETTE.amber,
              letterSpacing: 'clamp(4px, 1.5vw, 12px)',
            }}>
              {round.binary.split('').join(' ')}
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(110px, 1fr))', gap: 10, marginBottom: 22 }}>
            {round.options.map((opt) => {
              const showRight = feedback === 'right' && opt === round.answer;
              const showWrong = feedback === 'wrong' && opt === round.answer;
              return (
                <button
                  key={opt}
                  onClick={() => handleAnswer(opt)}
                  disabled={!!feedback}
                  style={{
                    background: (showRight || showWrong) ? PALETTE.moss : '#fff',
                    border: `2px solid ${PALETTE.ink}`, borderRadius: 4,
                    padding: '18px 12px',
                    fontFamily: FONT_DISPLAY, fontWeight: 900, fontSize: 34,
                    cursor: feedback ? 'default' : 'pointer',
                    color: (showRight || showWrong) ? '#fff' : PALETTE.ink,
                    boxShadow: feedback ? 'none' : `3px 3px 0 ${PALETTE.ink}`,
                    transition: 'all 0.15s ease',
                  }}
                >
                  {opt}
                </button>
              );
            })}
          </div>

          {feedback === 'right' && (
            <div style={{ color: PALETTE.moss, fontSize: 17, fontWeight: 600, textAlign: 'center' }}>
              <Icon name="check-circle" size={20} style={{ verticalAlign: 'middle', marginRight: 6 }} />
              Esatto!
            </div>
          )}
          {feedback === 'wrong' && (
            <div style={{ color: PALETTE.rust, fontSize: 17, textAlign: 'center' }}>
              Era <strong>{round.answer}</strong>. Niente paura, capita!
            </div>
          )}
        </>
      )}

      {finished && (
        <div style={{ textAlign: 'center', padding: '20px 0' }}>
          <div style={{ fontSize: 56, marginBottom: 12 }}>
            {score >= 5 ? '🏆' : score >= 4 ? '⭐' : score >= 2 ? '😊' : '💪'}
          </div>
          <h3 style={{ fontFamily: FONT_DISPLAY, fontSize: 32, fontWeight: 800, margin: '0 0 8px' }}>
            Hai fatto {score} su {rounds.length}!
          </h3>
          <p style={{ fontSize: 16, color: PALETTE.inkSoft, marginBottom: 6 }}>
            {score >= 5 ? 'Sei un decifratore esperto.' : score >= 4 ? 'Ottimo lavoro!' : score >= 2 ? 'Bel tentativo, puoi rifarlo.' : 'Riprova, ci prendi la mano!'}
          </p>
          {progress.module1.bestDecode > 0 && (
            <p style={{ fontSize: 13, color: PALETTE.warmGray, fontFamily: FONT_MONO, marginBottom: 22 }}>
              record: {progress.module1.bestDecode} / {rounds.length}
            </p>
          )}
          <div style={{ display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button onClick={restart} style={btnGhost()}>
              <Icon name="rotate-ccw" size={14} style={{ display: 'inline-block', marginRight: 6, verticalAlign: 'middle' }} />
              riprova
            </button>
            <button onClick={goNext} style={btnPrimary()}>avanti →</button>
          </div>
        </div>
      )}

      {!finished && (
        <div style={{ marginTop: 28 }}>
          <NavButtons goPrev={goPrev} hideNext />
        </div>
      )}
    </div>
  );
}

function M2_KitchenPage({ markDone, goNext, goPrev }) {
  const [phase, setPhase] = useState('idle'); // idle | cooking | done | shutdown
  const [pantry, setPantry] = useState(['🥚', '🍎', '🥛', '🍫', '🌾']);
  const [counter, setCounter] = useState([]);
  const [cake, setCake] = useState(false);

  const doCooking = () => {
    setPhase('cooking');
    // Sposta ingredienti uno per uno con delay
    const ingredients = ['🥚', '🍫', '🌾'];
    ingredients.forEach((ing, idx) => {
      setTimeout(() => {
        setCounter(prev => [...prev, ing]);
      }, 400 * (idx + 1));
    });
    setTimeout(() => {
      setCake(true);
      setPhase('done');
      markDone();
    }, 400 * (ingredients.length + 1) + 500);
  };

  const doShutdown = () => {
    setPhase('shutdown');
    setTimeout(() => {
      setCounter([]);
      setCake(false);
    }, 600);
  };

  const reset = () => {
    setPhase('idle');
    setCounter([]);
    setCake(false);
  };

  return (
    <div>
      <PageHeader eyebrow="Pagina 3 di 7" title="La cucina del computer" accent={PALETTE.moss} />
      <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 8 }}>

        Tocca <strong>"facciamo una torta"</strong> per vedere come lavora.

        background: PALETTE.cream,
        border: `2px solid ${PALETTE.ink}`,

            borderRadius: 4, padding: '12px 10px',

          }}>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: PALETTE.amber, fontWeight: 700, letterSpacing: 1, marginBottom: 6, textAlign: 'center' }}>
              DISPENSA<br /><span style={{ color: PALETTE.inkSoft, fontWeight: 400 }}>(DISCO)</span>

          </div>

          <div style={{
            background: '#fff',
            border: `2px solid ${PALETTE.moss}`,
            borderRadius: 4, padding: '12px 10px',
            display: 'flex', flexDirection: 'column', minHeight: 180,
          }}>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: PALETTE.moss, fontWeight: 700, letterSpacing: 1, marginBottom: 6, textAlign: 'center' }}>
              BANCO<br /><span style={{ color: PALETTE.inkSoft, fontWeight: 400 }}>(RAM)</span>
            </div>
            <div style={{
              flex: 1, background: PALETTE.cream, borderRadius: 3, padding: 8,

            </>
          )}
          {phase === 'shutdown' && (
            <button onClick={reset} style={btnPrimary()}>↻ riaccendi e rifai</button>
          )}
        </div>
      </div>

      {/* Spiegazione */}
      <div style={{
        background: phase === 'shutdown' ? `${PALETTE.rust}10` : PALETTE.creamDeep,
        border: `1.5px dashed ${phase === 'shutdown' ? PALETTE.rust : PALETTE.ink}`,
        padding: '14px 18px', borderRadius: 4, marginBottom: 20, fontSize: 15, lineHeight: 1.5,
      }}>

          <span><strong>Ecco la regola:</strong> lo chef (CPU) non prende mai gli ingredienti direttamente dalla dispensa — è troppo lontana e ci mette tanto. Prima li porta sul banco di lavoro (RAM), poi cucina.</span>

function M2_JourneyPage({ markDone, goNext, goPrev }) {
  const [step, setStep] = useState(-1); // -1 = idle
  const [playing, setPlaying] = useState(false);

  const steps = [
    { actor: 'finger', message: 'Tocchi l\'icona di WhatsApp 👆' },
    { actor: 'cpu', message: 'CPU: "Ho ricevuto il comando!"' },
    { actor: 'cpu-to-disk', message: 'CPU chiede al disco: "trova WhatsApp"' },
    { actor: 'disk', message: 'Disco: "L\'ho trovato! Te lo passo."' },
    { actor: 'disk-to-ram', message: 'I dati di WhatsApp vanno nella RAM' },
    { actor: 'ram', message: 'RAM: "Pronto! Ho WhatsApp sul banco."' },
    { actor: 'cpu-to-gpu', message: 'CPU dice alla GPU: "disegnalo!"' },
    { actor: 'gpu', message: 'GPU disegna sullo schermo... ✨' },
    { actor: 'done', message: 'WhatsApp è aperto! ⚡ Tutto questo in MENO di un secondo!' },
  ];

  const play = () => {
    setStep(0);
    setPlaying(true);
    steps.forEach((_, idx) => {
      setTimeout(() => {
        setStep(idx);
        if (idx === steps.length - 1) {
          setPlaying(false);
          markDone();
        }
      }, idx * 1100);
    });
  };

  const reset = () => {
    setStep(-1);
    setPlaying(false);
  };

  const isActive = (actor) => {
    if (step < 0) return false;
    const s = steps[step].actor;
    return s === actor || s.startsWith(actor + '-') || s.endsWith('-' + actor);
  };

  return (
    <div>
      <PageHeader eyebrow="Pagina 4 di 7" title="Il viaggio di WhatsApp" accent={PALETTE.moss} />
      <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 8 }}>
        Quando apri un'app, dentro al computer parte una <strong>staffetta veloce</strong>.
      </p>
      <p style={{ fontSize: 15, color: PALETTE.inkSoft, marginBottom: 22 }}>
        Premi play e guarda cosa succede.
      </p>

      {/* Scena */}
      <div style={{
        background: PALETTE.ink, borderRadius: 6,
        padding: '24px 18px', marginBottom: 14, position: 'relative',
        overflow: 'hidden', minHeight: 280,
      }}>
        <svg viewBox="0 0 400 240" width="100%" style={{ display: 'block' }}>
          {/* Connection lines */}
          <line x1="100" y1="80" x2="200" y2="80" stroke={isActive('cpu-to-disk') ? PALETTE.amber : PALETTE.inkSoft} strokeWidth={isActive('cpu-to-disk') ? 3 : 1} strokeDasharray="4,3" />
          <line x1="200" y1="80" x2="300" y2="80" stroke={isActive('disk-to-ram') ? PALETTE.amber : PALETTE.inkSoft} strokeWidth={isActive('disk-to-ram') ? 3 : 1} strokeDasharray="4,3" />
          <line x1="100" y1="80" x2="200" y2="170" stroke={isActive('cpu-to-gpu') ? PALETTE.amber : PALETTE.inkSoft} strokeWidth={isActive('cpu-to-gpu') ? 3 : 1} strokeDasharray="4,3" />

          {/* CPU */}
          <g>
            <rect x="50" y="50" width="100" height="60" rx="6" fill={isActive('cpu') ? PALETTE.rust : '#2a3550'} stroke={isActive('cpu') ? PALETTE.amber : PALETTE.inkSoft} strokeWidth="2" />
            <text x="100" y="78" textAnchor="middle" fontFamily={FONT_MONO} fontSize="11" fontWeight="700" fill={PALETTE.cream}>CPU</text>
            <text x="100" y="94" textAnchor="middle" fontFamily={FONT_BODY} fontSize="9" fill={PALETTE.cream} opacity="0.8">cervello</text>
            {isActive('cpu') && <circle cx="100" cy="80" r="38" fill="none" stroke={PALETTE.amber} strokeWidth="1.5" opacity="0.5"><animate attributeName="r" values="32;42;32" dur="1.2s" repeatCount="indefinite" /></circle>}

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="la gara delle velocità →" />

}

function M2_SpeedRacePage({ markDone, goNext, goPrev }) {
  const [racing, setRacing] = useState(false);
  const [quizStep, setQuizStep] = useState(0);
  const [quizAnswers, setQuizAnswers] = useState([]);

  const startRace = () => {
    setRacing(true);
    setTimeout(() => setRacing(false), 8500);
  };

  const quiz = [
    {
      q: 'Stai scrivendo una lettera al computer. Le parole che hai appena scritto, dove sono ADESSO?',
      options: [
        { text: 'Nel cervello (CPU)', correct: false, why: 'No, la CPU pensa veloce ma non immagazzina.' },
        { text: 'Sulla scrivania (RAM)', correct: true, why: 'Sì! Mentre lavori, le cose stanno sul banco veloce.' },
        { text: 'Nella libreria (Disco)', correct: false, why: 'No, lì vanno solo dopo che le salvi.' },
      ],
    },
    {
      q: 'Hai salvato la lettera e spento il computer. Dove sta adesso?',
      options: [
        { text: 'Sulla scrivania (RAM)', correct: false, why: 'No! Ricordi? La RAM si svuota allo spegnimento.' },
        { text: 'Nella libreria (Disco)', correct: true, why: 'Esatto! Solo il disco tiene le cose anche da spento.' },
        { text: 'Si è persa', correct: false, why: 'Niente paura, l\'hai salvata! Sta nel disco.' },
      ],
    },
    {
      q: 'Apri un gioco. Per giocare veloce, dove viene caricato?',
      options: [
        { text: 'Nella libreria (Disco)', correct: false, why: 'Il disco è lento per giocare. Va caricato altrove.' },
        { text: 'Sulla scrivania (RAM)', correct: true, why: 'Sì! La RAM è veloce, perfetta per i giochi.' },
        { text: 'In un altro computer', correct: false, why: 'Nope, tutto sta nel tuo computer.' },
      ],
    },
  ];

  const handleAnswer = (idx) => {
    const newAnswers = [...quizAnswers, idx];
    setQuizAnswers(newAnswers);
    if (newAnswers.length === quiz.length) markDone();
  };

  const resetQuiz = () => {
    setQuizStep(0);
    setQuizAnswers([]);
  };

  return (
    <div>
      <PageHeader eyebrow="Pagina 5 di 7" title="La gara delle velocità" accent={PALETTE.moss} />
      <p style={{ fontSize: 17, lineHeight: 1.6, marginBottom: 8 }}>
        Lo chef (<strong>CPU</strong>) è velocissimo. Il banco (<strong>RAM</strong>) è veloce. La dispensa (<strong>Disco</strong>) è lenta.
      </p>
      <p style={{ fontSize: 15, color: PALETTE.inkSoft, marginBottom: 22 }}>
        Quanto lenta? Fai partire la gara per scoprirlo.
      </p>

      {/* PISTA DI GARA */}
      <div style={{
        background: PALETTE.cream,
        border: `2px solid ${PALETTE.ink}`,
        borderRadius: 6, padding: '20px 16px', marginBottom: 18,
        overflow: 'hidden',
      }}>
        <SpeedRaceTrack racing={racing} />
        <div style={{ textAlign: 'center', marginTop: 14 }}>
          {!racing ? (
            <button onClick={startRace} style={{ ...btnPrimary(), background: PALETTE.moss, boxShadow: `3px 3px 0 ${PALETTE.amber}` }}>
              🏁 via alla gara!
            </button>
          ) : (
            <div style={{ fontFamily: FONT_MONO, color: PALETTE.moss, fontSize: 14, fontWeight: 600 }}>
              ⏱ corsa in corso...
            </div>
          )}
        </div>
      </div>

      <div style={{
        background: `${PALETTE.amber}15`,
        border: `1.5px dashed ${PALETTE.amber}`,
        padding: '14px 18px', borderRadius: 4, marginBottom: 22, fontSize: 15, lineHeight: 1.5,
      }}>
        🤯 <strong>La differenza vera:</strong> se la CPU aspetta la RAM, è come aspettare <strong>30 minuti</strong>. Se aspetta il disco, è come aspettare <strong>6 mesi!</strong> Per questo il computer fa di tutto per non disturbare il disco.
      </div>

      {/* QUIZ */}
      <div style={{ marginBottom: 18 }}>
        <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: PALETTE.inkSoft, letterSpacing: 2, fontWeight: 700, marginBottom: 12 }}>
          ░ DOMANDA DA SCIENZIATO ({Math.min(quizAnswers.length + 1, quiz.length)} di {quiz.length}) ░
        </div>

        {quizAnswers.length < quiz.length ? (
          <div style={{
            background: '#fff', border: `2px solid ${PALETTE.ink}`,
            borderRadius: 4, padding: '18px 20px',
          }}>
            <p style={{ margin: '0 0 14px', fontSize: 16, fontWeight: 500, lineHeight: 1.4 }}>
              {quiz[quizAnswers.length].q}
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              {quiz[quizAnswers.length].options.map((opt, i) => (
                <button key={i} onClick={() => handleAnswer(i)} style={{
                  ...btnGhost(),
                  textAlign: 'left',
                  padding: '12px 16px',
                  fontSize: 15,
                }}>
                  {opt.text}
                </button>
              ))}
            </div>
          </div>
        ) : (
          <div>
            {quiz.map((q, qi) => {
              const ai = quizAnswers[qi];
              const opt = q.options[ai];
              return (
                <div key={qi} style={{
                  background: opt.correct ? `${PALETTE.moss}15` : `${PALETTE.rust}15`,
                  border: `1.5px solid ${opt.correct ? PALETTE.moss : PALETTE.rust}`,
                  padding: '12px 16px', borderRadius: 4, marginBottom: 10, fontSize: 14, lineHeight: 1.4,
                }}>
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8 }}>
                    <Icon name="check-circle" size={16} color={opt.correct ? PALETTE.moss : PALETTE.rust} style={{ flexShrink: 0, marginTop: 2 }} />
                    <div>
                      <div style={{ fontWeight: 600, marginBottom: 4 }}>{q.q}</div>
                      <div>Hai detto: <em>{opt.text}</em> — {opt.why}</div>
                    </div>
                  </div>
                </div>
              );
            })}
            <button onClick={resetQuiz} style={{ ...btnGhost(), marginTop: 8 }}>↻ rifai il quiz</button>
          </div>
        )}
      </div>

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="anche nel telefono! →" />
    </div>
  );
}

const PIXEL_PALETTE = [
  '#1a2540', '#ffffff', '#c0432a', '#e8a317', '#f5d000',
  '#4a8a5c', '#2d7dd2', '#9b59b6', '#e91e8c', '#8b5a2b', '#9a9285',
];

// Genera un piccolo "paesaggio" 16x16 con sfumature (sembra una mini-foto)
function makeLandscape() {
  const W = 16, H = 16, px = [];
  const flowers = [[3, 12], [11, 13], [7, 14]];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let color;
      if (y < 7) {
        // sole in alto a destra
        const dx = x - 12.5, dy = y - 2;
        if (dx * dx + dy * dy < 6) {
          color = (dx * dx + dy * dy < 2) ? '#ffe066' : '#ffd11a';
        } else {
          // cielo sfumato: piu intenso in alto
          const t = y / 7;
          const r = Math.round(91 + t * 100);
          const g = Math.round(155 + t * 70);
          const b = Math.round(213 + t * 30);
          color = `rgb(${r},${Math.min(g,235)},${Math.min(b,245)})`;
        }
      } else {
        // erba sfumata + variazione
        const isFlower = flowers.some(([fx, fy]) => fx === x && fy === y);
        const isCenter = flowers.some(([fx, fy]) => fx === x && fy === y - 1);
        if (isFlower) color = '#e91e8c';
        else if (isCenter) color = '#f5d000';
        else {
          const t = (y - 7) / 8;
          const noise = ((x * 7 + y * 13) % 5) - 2;
          const g = Math.round(150 - t * 50 + noise * 4);
          color = `rgb(${Math.round(74 + noise*3)},${g},${Math.round(70 - t*20)})`;
        }
      }
      px.push(color);
    }
  }
  return px;
}

function M3_StudioPage({ markDone, goNext, goPrev, progress, updatePixelArt }) {
  const GRID = 16;
  const [grid, setGrid] = useState(() => {
    if (progress.module3.pixelArt && progress.module3.pixelArt.length === GRID * GRID) {
      return progress.module3.pixelArt;
    }
    return new Array(GRID * GRID).fill(null);
  });
  const [color, setColor] = useState(PIXEL_PALETTE[2]);
  const [erasing, setErasing] = useState(false);
  const [drawing, setDrawing] = useState(false);
  const [painted, setPainted] = useState(false);

  // Salva quando cambia (debounce leggero via timeout)
  useEffect(() => {
    const t = setTimeout(() => updatePixelArt(grid), 400);
    return () => clearTimeout(t);
  }, [grid]);

  useEffect(() => {
    const stop = () => setDrawing(false);
    window.addEventListener('pointerup', stop);
    return () => window.removeEventListener('pointerup', stop);
  }, []);

  const paintAt = (idx) => {
    if (idx == null || idx < 0) return;
    setGrid(prev => {
      const next = [...prev];
      next[idx] = erasing ? null : color;
      return next;
    });
    if (!painted) { setPainted(true); markDone(); }
  };

  const handlePointerDown = (idx) => { setDrawing(true); paintAt(idx); };
  const handlePointerEnter = (idx) => { if (drawing) paintAt(idx); };

  // touch drag support
  const handleTouchMove = (e) => {
    const t = e.touches[0];
    if (!t) return;
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.dataset && el.dataset.idx != null) paintAt(parseInt(el.dataset.idx, 10));
  };

  const clearAll = () => setGrid(new Array(GRID * GRID).fill(null));

  return (
    <div>
      <PageHeader eyebrow="Pagina 2 di 7" title="Lo studio dei pixel" accent={PALETTE.rust} />
      <p style={{ fontSize: 16, lineHeight: 1.55, marginBottom: 6 }}>
        Scegli un colore e disegna sulla griglia. Tieni premuto e trascina per colorare in fretta.
      </p>
      <p style={{ fontSize: 14, color: PALETTE.inkSoft, marginBottom: 18, fontStyle: 'italic' }}>
        Il tuo disegno si salva da solo. ✏️
      </p>

      {/* Palette */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 14, alignItems: 'center' }}>
        {PIXEL_PALETTE.map((c) => (
          <button key={c} onClick={() => { setColor(c); setErasing(false); }} style={{
            width: 30, height: 30, borderRadius: 4, background: c,
            border: `3px solid ${color === c && !erasing ? PALETTE.ink : '#fff'}`,
            boxShadow: `0 0 0 1px ${PALETTE.paperLine}`,
            cursor: 'pointer', padding: 0,
          }} />
        ))}
        <button onClick={() => setErasing(true)} style={{
          height: 30, padding: '0 12px', borderRadius: 4,
          background: erasing ? PALETTE.ink : '#fff',
          color: erasing ? '#fff' : PALETTE.ink,
          border: `2px solid ${PALETTE.ink}`, cursor: 'pointer',
          fontSize: 13, fontWeight: 600,
        }}>
          🧽 gomma
        </button>
      </div>

      {/* Griglia */}
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 14 }}>
        <div
          onTouchMove={handleTouchMove}
          style={{
            display: 'grid',
            gridTemplateColumns: `repeat(${GRID}, 1fr)`,
            width: 'min(100%, 384px)',
            aspectRatio: '1 / 1',
            border: `2px solid ${PALETTE.ink}`,
            background: PALETTE.paperLine,
            gap: 1,
            touchAction: 'none',
            userSelect: 'none',
          }}
        >
          {grid.map((c, i) => (
            <div
              key={i}
              data-idx={i}
              onPointerDown={() => handlePointerDown(i)}
              onPointerEnter={() => handlePointerEnter(i)}
              style={{
                background: c || PALETTE.cream,
                cursor: 'pointer',
              }}
            />
          ))}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginBottom: 18, flexWrap: 'wrap' }}>
        <button onClick={clearAll} style={btnGhost()}>
          <Icon name="rotate-ccw" size={13} style={{ display: 'inline-block', marginRight: 5, verticalAlign: 'middle' }} />
          pulisci tutto
        </button>
      </div>

      <div style={{ fontSize: 13, color: PALETTE.inkSoft, fontStyle: 'italic', textAlign: 'center', marginBottom: 16 }}>
        Questa griglia è 16×16 = <strong>256 pixel</strong>. Lo schermo del telefono ne ha milioni!
      </div>

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="la macchina dei colori →" disableNext={!painted && !(progress.module3.pixelArt)} />
    </div>
  );
}

function M3_ZoomPage({ markDone, goNext, goPrev }) {
  const [zoom, setZoom] = useState(1);
  const landscape = React.useMemo(() => makeLandscape(), []);

  useEffect(() => {
    if (zoom >= 4) markDone();
  }, [zoom]);

  const W = 16;
  const view = Math.max(4, Math.round(W / zoom)); // celle visibili per lato
  const start = Math.floor((W - view) / 2);
  const showBorders = zoom >= 2.5;

  // Estrai la finestra centrale
  const cells = [];
  for (let y = start; y < start + view; y++) {
    for (let x = start; x < start + view; x++) {
      cells.push(landscape[y * W + x]);
    }
  }

  return (
    <div>
      <PageHeader eyebrow="Pagina 4 di 7" title="Zoom nella foto" accent={PALETTE.rust} />
      <p style={{ fontSize: 16, lineHeight: 1.55, marginBottom: 6 }}>
        Ecco una piccola <strong>foto</strong>: un prato con il sole e dei fiori. Sembra liscia, vero?
      </p>
      <p style={{ fontSize: 14, color: PALETTE.inkSoft, marginBottom: 18, fontStyle: 'italic' }}>
        Muovi la lente e zooma fino in fondo. Cosa scopri?
      </p>

      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 16 }}>
        <div style={{
          width: 'min(100%, 320px)', aspectRatio: '1/1',
          border: `3px solid ${PALETTE.ink}`, borderRadius: 4,
          overflow: 'hidden', boxShadow: `4px 4px 0 ${PALETTE.ink}`,
          display: 'grid', gridTemplateColumns: `repeat(${view}, 1fr)`,
          gap: showBorders ? 1 : 0, background: PALETTE.ink,
        }}>
          {cells.map((c, i) => (
            <div key={i} style={{ background: c, width: '100%', height: '100%' }} />
          ))}
        </div>
      </div>

      {/* Slider zoom */}
      <div style={{ maxWidth: 360, margin: '0 auto 18px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: PALETTE.inkSoft, fontFamily: FONT_MONO, marginBottom: 4 }}>
          <span>👁 tutta la foto</span>
          <span>super zoom 🔬</span>
        </div>
        <input
          type="range" min="1" max="4" step="0.1" value={zoom}
          onChange={(e) => setZoom(parseFloat(e.target.value))}
          style={{ width: '100%', accentColor: PALETTE.rust, height: 28 }}
        />
      </div>

      <div style={{
        background: zoom >= 2.5 ? `${PALETTE.rust}12` : PALETTE.creamDeep,
        border: `1.5px dashed ${zoom >= 2.5 ? PALETTE.rust : PALETTE.ink}`,
        padding: '14px 18px', borderRadius: 4, marginBottom: 20, fontSize: 15, lineHeight: 1.5,
      }}>
        {zoom < 2.5 ? (
          <span>Da lontano sembra una foto normale. Continua a zoomare...</span>
        ) : (
          <span>🤯 <strong>Ecco il segreto!</strong> Anche le sfumature del cielo e dell'erba sono fatte di <strong>quadratini</strong>. Ogni quadratino è un pixel di un colore preciso. <strong>Ogni foto del mondo è fatta così.</strong></span>
        )}
      </div>

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="quanti puntini? →" disableNext={zoom < 4} />
    </div>
  );
}

  const [res, setRes] = useState(4);
  useEffect(() => {
    if (res >= 16) markDone();
  }, [res]);

  // Disegna un cerchio (faccina sole) a risoluzione variabile
  const renderCircle = (n) => {
    const cells = [];
    const c = (n - 1) / 2;
    const radius = n / 2;
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        const dx = x - c, dy = y - c;
        const dist = Math.sqrt(dx * dx + dy * dy);
        cells.push(dist <= radius - 0.3 ? '#e8a317' : PALETTE.cream);
      }
    }
    return (
      <div style={{
        display: 'grid', gridTemplateColumns: `repeat(${n}, 1fr)`,
        width: 200, height: 200, gap: 1, background: PALETTE.paperLine,
        border: `2px solid ${PALETTE.ink}`,
      }}>
        {cells.map((col, i) => <div key={i} style={{ background: col }} />)}
      </div>
    );
  };

  const resLabel = res <= 4 ? 'pochi pixel' : res <= 8 ? 'qualche pixel' : res <= 16 ? 'tanti pixel' : 'tantissimi';

  return (
    <div>
      <PageHeader eyebrow="Pagina 5 di 7" title="Quanti puntini?" accent={PALETTE.rust} />
      <p style={{ fontSize: 16, lineHeight: 1.55, marginBottom: 6 }}>

        Sposta il cursore e guarda il cerchio diventare più liscio.
      </p>

      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 12 }}>
        {renderCircle(res)}
      </div>
      <div style={{ textAlign: 'center', marginBottom: 16 }}>
        <span style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: PALETTE.rust }}>
          {res} × {res} = {res * res} pixel

        <span style={{ fontSize: 13, color: PALETTE.inkSoft, marginLeft: 8 }}>({resLabel})</span>
      </div>

      <div style={{ maxWidth: 360, margin: '0 auto 18px' }}>
        <input
          type="range" min="4" max="32" step="2" value={res}
          onChange={(e) => setRes(parseInt(e.target.value, 10))}
          style={{ width: '100%', accentColor: PALETTE.rust, height: 28 }}

        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, color: PALETTE.inkSoft, fontFamily: FONT_MONO }}>

        padding: '14px 18px', borderRadius: 4, marginBottom: 20, fontSize: 15, lineHeight: 1.5,

// ============================================================================

// Direzioni: N(su) E(dx) S(giu) W(sx)
const DIRS = ['N', 'E', 'S', 'W'];
const DELTA = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
const turnRight = (d) => DIRS[(DIRS.indexOf(d) + 1) % 4];
const turnLeft = (d) => DIRS[(DIRS.indexOf(d) + 3) % 4];

function runProgram(level, program) {
  let state = { ...level.start };
  const trail = [{ ...state }];
  let crashed = false;
  for (const cmd of program) {
    if (cmd === 'L') state = { ...state, dir: turnLeft(state.dir) };
    else if (cmd === 'R') state = { ...state, dir: turnRight(state.dir) };
    else if (cmd === 'F') {
      const [dx, dy] = DELTA[state.dir];
      const nx = state.x + dx, ny = state.y + dy;
      const out = nx < 0 || ny < 0 || nx >= level.size || ny >= level.size;
      const wall = level.walls.some(([wx, wy]) => wx === nx && wy === ny);
      if (out || wall) { crashed = true; trail.push({ ...state, crash: true }); break; }
      state = { ...state, x: nx, y: ny };
    }
    trail.push({ ...state });
  }
  const reached = !crashed && state.x === level.goal.x && state.y === level.goal.y;
  return { trail, crashed, reached };
}

// --- Componente griglia robot riutilizzabile ---
function RobotGrid({ level, robotState, size = 280 }) {
  const cell = size / level.size;
  const rs = robotState || level.start;
  const rot = { N: 0, E: 90, S: 180, W: 270 }[rs.dir];

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{ maxWidth: size, display: 'block', margin: '0 auto' }}>
      {/* celle */}
      {Array.from({ length: level.size }).map((_, y) =>
        Array.from({ length: level.size }).map((_, x) => {
          const isWall = level.walls.some(([wx, wy]) => wx === x && wy === y);
          return (
            <rect key={`${x}-${y}`} x={x * cell} y={y * cell} width={cell} height={cell}
              fill={isWall ? PALETTE.inkSoft : PALETTE.cream}
              stroke={PALETTE.paperLine} strokeWidth="1" />
          );
        })
      )}
      {/* goal */}
      <text x={level.goal.x * cell + cell / 2} y={level.goal.y * cell + cell / 2 + cell * 0.18}
        textAnchor="middle" fontSize={cell * 0.55}>🏁</text>
      {/* robot */}
      <g transform={`translate(${rs.x * cell + cell / 2}, ${rs.y * cell + cell / 2}) rotate(${rot})`}
        style={{ transition: 'transform 0.3s ease' }}>
        <circle r={cell * 0.32} fill={rs.crash ? PALETTE.rust : PALETTE.moss} stroke={PALETTE.ink} strokeWidth="2" />
        <polygon points={`0,${-cell * 0.28} ${cell * 0.13},${-cell * 0.1} ${-cell * 0.13},${-cell * 0.1}`} fill={PALETTE.cream} />
        <circle cx={-cell * 0.1} cy={cell * 0.05} r={cell * 0.05} fill={PALETTE.ink} />
        <circle cx={cell * 0.1} cy={cell * 0.05} r={cell * 0.05} fill={PALETTE.ink} />
      </g>
    </svg>
  );
}

// --- Builder di programma (sequenza comandi) ---
function ProgramRunner({ level, initialProgram = [], locked = false, onResult, instruction }) {
  const [program, setProgram] = useState(initialProgram);
  const [robotState, setRobotState] = useState(level.start);
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);

  const cmdLabel = { F: '⬆ avanti', L: '↺ sinistra', R: '↻ destra' };

  const addCmd = (c) => { if (!running) { setProgram(p => [...p, c]); setResult(null); } };
  const removeLast = () => { if (!running) { setProgram(p => p.slice(0, -1)); setResult(null); } };
  const clear = () => { if (!running) { setProgram([]); setResult(null); setRobotState(level.start); } };

  const execute = () => {
    if (running || program.length === 0) return;
    setRunning(true);
    setResult(null);
    const { trail, reached } = runProgram(level, program);
    trail.forEach((st, i) => {
      setTimeout(() => {
        setRobotState(st);
        if (i === trail.length - 1) {
          setRunning(false);
          setResult(reached ? 'win' : 'fail');
          if (reached && onResult) onResult();
        }
      }, i * 400);
    });
  };

  const reset = () => { setRobotState(level.start); setResult(null); };

  return (
    <div>
      <div style={{ background: PALETTE.cream, border: `1.5px solid ${PALETTE.paperLine}`, borderRadius: 6, padding: 16, marginBottom: 14 }}>
        <RobotGrid level={level} robotState={robotState} />
      </div>

      {instruction && (
        <p style={{ fontSize: 15, color: PALETTE.inkSoft, marginBottom: 12, textAlign: 'center' }}>{instruction}</p>
      )}

      {/* Programma corrente */}
      <div style={{
        minHeight: 44, background: '#fff', border: `2px solid ${PALETTE.ink}`,
        borderRadius: 4, padding: '8px 10px', marginBottom: 10,
        display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center',
      }}>
        {program.length === 0 ? (
          <span style={{ color: PALETTE.warmGray, fontStyle: 'italic', fontSize: 14 }}>
            il tuo programma appare qui...
          </span>
        ) : program.map((c, i) => (
          <span key={i} style={{
            background: PALETTE.moss, color: '#fff', fontSize: 13, fontWeight: 600,
            padding: '4px 8px', borderRadius: 3, fontFamily: FONT_MONO,
          }}>{cmdLabel[c]}</span>
        ))}
      </div>

      {/* Pulsanti comando */}
      {!locked && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
          <button onClick={() => addCmd('F')} style={cmdBtn()}>⬆ avanti</button>
          <button onClick={() => addCmd('L')} style={cmdBtn()}>↺ gira sx</button>
          <button onClick={() => addCmd('R')} style={cmdBtn()}>↻ gira dx</button>
          <button onClick={removeLast} style={{ ...cmdBtn(), background: '#fff' }}>⌫ togli</button>
          <button onClick={clear} style={{ ...cmdBtn(), background: '#fff' }}>🗑 svuota</button>
        </div>
      )}

      {/* Esegui */}
      <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
        <button onClick={execute} disabled={running || program.length === 0}
          style={{ ...btnPrimary(), background: PALETTE.moss, boxShadow: `3px 3px 0 ${PALETTE.amber}`, opacity: (running || program.length === 0) ? 0.5 : 1 }}>
          <Icon name="play" size={14} fill="currentColor" style={{ display: 'inline-block', marginRight: 6, verticalAlign: 'middle' }} />
          {running ? 'in corso...' : 'esegui!'}
        </button>
        {result && !running && (
          <button onClick={reset} style={btnGhost()}>↻ riprova</button>
        )}
      </div>

      {/* Esito */}
      {result === 'win' && (
        <div style={{ background: `${PALETTE.moss}15`, border: `1.5px solid ${PALETTE.moss}`, borderRadius: 4, padding: '12px 16px', color: PALETTE.moss, fontWeight: 600, fontSize: 16, textAlign: 'center' }}>
          <Icon name="check-circle" size={18} style={{ verticalAlign: 'middle', marginRight: 6 }} />
          Il robot ha trovato il tesoro! 🎉
        </div>
      )}
      {result === 'fail' && (
        <div style={{ background: `${PALETTE.rust}12`, border: `1.5px solid ${PALETTE.rust}`, borderRadius: 4, padding: '12px 16px', color: PALETTE.rust, fontSize: 15, textAlign: 'center' }}>
          Ahia! Il robot non è arrivato al tesoro. Niente paura: <strong>cambia i comandi e riprova.</strong>
        </div>
      )}
    </div>
  );
}

  return {
    background: PALETTE.creamDeep, border: `2px solid ${PALETTE.ink}`,
    borderRadius: 4, padding: '8px 12px', fontSize: 14, fontWeight: 600,

function M4_DebugPage({ markDone, goNext, goPrev }) {
  // programma quasi giusto: c'e un comando sbagliato che fa sbattere
  const level = { size: 5, start: { x: 0, y: 4, dir: 'N' }, goal: { x: 2, y: 0 }, walls: [[1, 1], [1, 2], [1, 3]] };
  // percorso corretto: F F (sale a y2), R, F F (va a x2), L, F F (sale a y0)
  const [program, setProgram] = useState(['F', 'F', 'F', 'F', 'R', 'F', 'F', 'L', 'F', 'F']);
  const [robotState, setRobotState] = useState(level.start);
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);

  const cmdLabel = { F: '⬆', L: '↺', R: '↻' };

  const execute = () => {
    if (running) return;
    setRunning(true); setResult(null);
    const { trail, reached } = runProgram(level, program);
    trail.forEach((st, i) => setTimeout(() => {
      setRobotState(st);
      if (i === trail.length - 1) {
        setRunning(false);
        setResult(reached ? 'win' : 'fail');
        if (reached) markDone();
      }
    }, i * 380));
  };

  const removeAt = (idx) => {
    if (running) return;
    setProgram(p => p.filter((_, i) => i !== idx));
    setResult(null); setRobotState(level.start);
  };
  const reset = () => { setRobotState(level.start); setResult(null); };

  return (
    <div>
      <PageHeader eyebrow="Pagina 4 di 7" title="Il bug nascosto" accent={PALETTE.moss} />
      <p style={{ fontSize: 16, lineHeight: 1.55, marginBottom: 8 }}>
        Questo programma è <strong>quasi</strong> giusto, ma ha un comando di troppo: un <strong>bug</strong>. Eseguilo e guarda dove il robot sbaglia.
      </p>
      <p style={{ fontSize: 15, color: PALETTE.inkSoft, marginBottom: 16 }}>
        Poi <strong>tocca il comando sbagliato</strong> per toglierlo, e riprova. Trovare e correggere l'errore si chiama <strong>debug</strong>.
      </p>

      <div style={{ background: PALETTE.cream, border: `1.5px solid ${PALETTE.paperLine}`, borderRadius: 6, padding: 16, marginBottom: 14 }}>
        <RobotGrid level={level} robotState={robotState} />
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 12, justifyContent: 'center' }}>
        {program.map((c, i) => (
          <button key={i} onClick={() => removeAt(i)} title="tocca per togliere" style={{
            background: PALETTE.moss, color: '#fff', border: `2px solid ${PALETTE.ink}`,
            borderRadius: 4, width: 40, height: 40, fontSize: 18, cursor: 'pointer', fontFamily: FONT_MONO,
          }}>{cmdLabel[c]}</button>
        ))}
      </div>

      <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
        <button onClick={execute} disabled={running} style={{ ...btnPrimary(), background: PALETTE.moss, boxShadow: `3px 3px 0 ${PALETTE.amber}`, opacity: running ? 0.5 : 1 }}>
          <Icon name="play" size={14} fill="currentColor" style={{ display: 'inline-block', marginRight: 6, verticalAlign: 'middle' }} />
          {running ? 'in corso...' : 'esegui!'}
        </button>
        {result && !running && <button onClick={reset} style={btnGhost()}>↻ riprova</button>}
      </div>

      {result === 'win' && (
        <div style={{ background: `${PALETTE.moss}15`, border: `1.5px solid ${PALETTE.moss}`, borderRadius: 4, padding: '12px 16px', color: PALETTE.moss, fontWeight: 600, fontSize: 16, textAlign: 'center', marginBottom: 8 }}>
          <Icon name="check-circle" size={18} style={{ verticalAlign: 'middle', marginRight: 6 }} />
          Hai trovato il bug! Il robot è arrivato. 🎉
        </div>
      )}
      {result === 'fail' && (
        <div style={{ background: `${PALETTE.rust}12`, border: `1.5px solid ${PALETTE.rust}`, borderRadius: 4, padding: '12px 16px', color: PALETTE.rust, fontSize: 15, textAlign: 'center', marginBottom: 8 }}>
          Il robot ha sbagliato strada. C'è un comando di troppo: quale? Toccalo per toglierlo.
        </div>
      )}

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="la ripetizione →" />
    </div>
  );
}

// ----------------------------------------------------------------------------

function M4_ConditionPage({ markDone, goNext, goPrev }) {
  // Robot segue regola: SE muro davanti -> gira a destra; ALTRIMENTI -> avanti
  const level = { size: 5, start: { x: 0, y: 4, dir: 'N' }, goal: { x: 4, y: 0 }, walls: [[0, 1], [1, 1], [2, 1], [2, 2], [2, 3]] };
  const [robotState, setRobotState] = useState(level.start);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);

  const run = () => {
    if (running) return;
    setRunning(true); setDone(false);
    // simula regola condizionale per max 30 passi
    let state = { ...level.start };
    const trail = [{ ...state }];
    for (let step = 0; step < 30; step++) {
      if (state.x === level.goal.x && state.y === level.goal.y) break;
      const [dx, dy] = DELTA[state.dir];
      const nx = state.x + dx, ny = state.y + dy;
      const out = nx < 0 || ny < 0 || nx >= level.size || ny >= level.size;
      const wall = level.walls.some(([wx, wy]) => wx === nx && wy === ny);
      if (out || wall) {
        state = { ...state, dir: turnRight(state.dir) }; // SE muro -> gira
      } else {
        state = { ...state, x: nx, y: ny }; // ALTRIMENTI -> avanti
      }
      trail.push({ ...state });
    }
    trail.forEach((st, i) => setTimeout(() => {
      setRobotState(st);
      if (i === trail.length - 1) { setRunning(false); setDone(true); markDone(); }
    }, i * 350));
  };

  const reset = () => { setRobotState(level.start); setDone(false); };

  return (
    <div>
      <PageHeader eyebrow="Pagina 6 di 7" title="Se... allora" accent={PALETTE.moss} />
      <p style={{ fontSize: 16, lineHeight: 1.55, marginBottom: 14 }}>
        I computer sanno anche <strong>decidere</strong>. Diamo al robot una regola e lui la segue da solo, scegliendo cosa fare in ogni momento:
      </p>

      <div style={{ background: PALETTE.ink, color: PALETTE.cream, borderRadius: 6, padding: '14px 18px', marginBottom: 16, fontFamily: FONT_MONO, fontSize: 14, lineHeight: 1.7 }}>
        <div><span style={{ color: PALETTE.amber }}>SE</span> c'è un muro davanti → <span style={{ color: PALETTE.amberGlow }}>gira a destra</span></div>
        <div><span style={{ color: PALETTE.amber }}>ALTRIMENTI</span> → <span style={{ color: PALETTE.amberGlow }}>vai avanti</span></div>
      </div>

      <div style={{ background: PALETTE.cream, border: `1.5px solid ${PALETTE.paperLine}`, borderRadius: 6, padding: 16, marginBottom: 14 }}>
        <RobotGrid level={level} robotState={robotState} />
      </div>

      <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginBottom: 14, flexWrap: 'wrap' }}>
        <button onClick={run} disabled={running} style={{ ...btnPrimary(), background: PALETTE.moss, boxShadow: `3px 3px 0 ${PALETTE.amber}`, opacity: running ? 0.5 : 1 }}>
          <Icon name="play" size={14} fill="currentColor" style={{ display: 'inline-block', marginRight: 6, verticalAlign: 'middle' }} />
          {running ? 'il robot decide...' : 'lascia decidere il robot'}
        </button>
        {done && <button onClick={reset} style={btnGhost()}>↻ ancora</button>}
      </div>

      {done && (
        <div style={{ background: `${PALETTE.moss}15`, border: `1.5px solid ${PALETTE.moss}`, borderRadius: 4, padding: '12px 16px', color: PALETTE.moss, fontSize: 15, textAlign: 'center', marginBottom: 8 }}>
          Visto? Con una sola regola, il robot ha deciso da solo a ogni passo. Questo si chiama <strong>condizione</strong>.
        </div>
      )}

      <NavButtons goPrev={goPrev} goNext={goNext} nextLabel="hai finito! →" />
    </div>
  );
}

      </div>
